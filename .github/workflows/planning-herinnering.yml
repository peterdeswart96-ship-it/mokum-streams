name: Herinnering ongeplande toernooien

# Kijkt 's middags of er vanavond een toernooi speelt dat nog niet is ingepland. Zo ja, dan
# een mailtje; zo nee, dan hoor je niets. Dat laatste is belangrijk: een bericht dat elke dag
# komt wordt genegeerd, en dan mis je 'm juist op de dag dat het ertoe doet.
#
# LET OP de tijd. GitHub voert geplande workflows uit "als het uitkomt" — op 04-08 vuurden
# deze crons twee uur te laat. Er stond eerst een controle in die alleen doorging als het
# precies 15:00 in Amsterdam was; die maakte van elke vertraging stilte, en toen kwam er dus
# geen herinnering. Nu: één cron, geen poortwachter.
#
# 11:00 UTC is 13:00 in de zomer en 12:00 in de winter. Met de gebruikelijke vertraging landt
# het bericht ruim vóór een avondtoernooi, en dat is het enige dat telt.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  herinnering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Planning nakijken
        id: check
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RAPPORT_VAN: ${{ secrets.RAPPORT_SMTP_GEBRUIKER }}
          RAPPORT_AAN: ${{ secrets.RAPPORT_ONTVANGERS }}
        run: |
          set -euo pipefail
          node scripts/planning-herinnering.js --uit herinnering.txt | tee uitvoer.log
          if grep -q '^versturen=ja$' uitvoer.log; then
            echo "versturen=ja" >> "$GITHUB_OUTPUT"
          else
            echo "versturen=nee" >> "$GITHUB_OUTPUT"
          fi

      - name: Versturen
        if: steps.check.outputs.versturen == 'ja'
        env:
          GEBRUIKER: ${{ secrets.RAPPORT_SMTP_GEBRUIKER }}
          WACHTWOORD: ${{ secrets.RAPPORT_SMTP_WACHTWOORD }}
          ONTVANGERS: ${{ secrets.RAPPORT_ONTVANGERS }}
        run: |
          set -euo pipefail
          ontvangers=""
          IFS=',' read -ra lijst <<< "$ONTVANGERS"
          for adres in "${lijst[@]}"; do
            ontvangers="$ontvangers --mail-rcpt $(echo "$adres" | xargs)"
          done
          # shellcheck disable=SC2086
          curl --silent --show-error --ssl-reqd \
            --url 'smtps://smtp.gmail.com:465' \
            --user "$GEBRUIKER:$WACHTWOORD" \
            --mail-from "$GEBRUIKER" $ontvangers \
            --upload-file herinnering.txt
          echo "Herinnering verstuurd."
