<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mokum — highlights keuren</title>
<link rel="icon" href="/mokum-logo.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #0a0a0a; color: #ccc; }
  header {
    position: sticky; top: 0; z-index: 5; background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
    padding: 12px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header .titel { font-family: "Arial Black", Arial, sans-serif; font-size: 18px; color: #fff; }
  header .titel .m { color: #cc0000; }
  .telling { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .pil { border-radius: 999px; padding: 5px 12px; font-size: 13px; background: #2a2a2a; }
  .pil.goed { background: #14532d; color: #b7f7c8; }
  .pil.af   { background: #4a1212; color: #ffb3b3; }

  main { max-width: 960px; margin: 0 auto; padding: 16px 16px 60px; }
  .doek { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid #2a2a2a; }
  .doek iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .info { display: flex; align-items: baseline; gap: 12px; margin: 14px 2px 4px; flex-wrap: wrap; }
  .info .naam { font-family: "Arial Black", Arial, sans-serif; font-size: 24px; color: #fff; }
  .info .tegen { font-size: 14px; color: #999; }
  .info .meta { margin-left: auto; font-size: 13px; color: #888; text-align: right; }

  .knoppen { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button {
    background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc; border-radius: 10px;
    padding: 12px 18px; font: inherit; font-size: 15px; cursor: pointer;
  }
  button:hover { border-color: #444; }
  button.goed { background: #14532d; border-color: #1c6b3c; color: #d6ffe3; }
  button.goed:hover { background: #1c6b3c; }
  button.af { background: #4a1212; border-color: #6b1c1c; color: #ffd6d6; }
  button.af:hover { background: #6b1c1c; }
  button.groei { flex: 1; }
  .snelheid { align-self: center; color: #888; font-size: 13px; margin-right: 2px; }
  button.snelknop { padding: 12px 14px; }
  button.snelknop.actief { background: #cc0000; border-color: #cc0000; color: #fff; }
  kbd {
    background: #000; border: 1px solid #333; border-radius: 4px; padding: 1px 6px;
    font-family: Consolas, monospace; font-size: 12px; color: #999; margin-left: 6px;
  }

  .balk { height: 6px; background: #1a1a1a; border-radius: 3px; overflow: hidden; margin: 16px 0 4px; }
  .balk span { display: block; height: 100%; background: #cc0000; width: 0; transition: width .25s; }
  .voortgang { font-size: 12px; color: #888; text-align: center; }
  .melding { text-align: center; color: #999; padding: 50px 16px; font-size: 15px; }
  .fout { color: #ff6b6b; }
  .melding a { color: #ff6b6b; font-weight: bold; }
  .rij-filter { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #999; margin-top: 12px; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: #cc0000; }
  .token { display: flex; gap: 8px; }
  .token input {
    flex: 1; background: #1a1a1a; border: 1px solid #2a2a2a; color: #fff;
    border-radius: 8px; padding: 10px 12px; font: inherit;
  }

  .viewknop { padding: 8px 14px; font-size: 14px; }
  .filterbalk { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .filterbalk select, .filterbalk input {
    background: #1a1a1a; border: 1px solid #2a2a2a; color: #fff; border-radius: 8px;
    padding: 8px 10px; font: inherit; font-size: 14px;
  }
  .filterbalk input[type=search] { flex: 1; min-width: 160px; }
  .tabelinfo { color: #888; font-size: 13px; margin-left: auto; }
  .tabelwrap { overflow-x: auto; border: 1px solid #2a2a2a; border-radius: 10px; }
  table.clips { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 780px; }
  table.clips th {
    text-align: left; color: #888; font-weight: normal; padding: 10px 12px;
    border-bottom: 1px solid #2a2a2a; position: sticky; top: 0; background: #141414;
  }
  table.clips td { padding: 9px 12px; border-bottom: 1px solid #1e1e1e; }
  table.clips td.tijd { font-variant-numeric: tabular-nums; color: #bbb; }
  table.clips tbody tr { cursor: pointer; }
  table.clips tbody tr:hover { background: #181818; }
  table.clips tbody tr.aangepast td.tijd { color: #ffcf6b; }
  table.clips a.kijk { color: #ff6b6b; text-decoration: none; font-size: 16px; }
  table.clips a.kijk:hover { text-decoration: underline; }
  .stat { border-radius: 999px; padding: 3px 10px; font-size: 12px; white-space: nowrap; }
  .stat.goed { background: #14532d; color: #b7f7c8; }
  .stat.af   { background: #4a1212; color: #ffb3b3; }
  .stat.open { background: #2a2a2a; color: #bbb; }
</style>
</head>
<body>
  <header>
    <span class="titel"><span class="m">Mokum</span> — highlights keuren</span>
    <button id="bView" class="viewknop" hidden>📋 Overzicht</button>
    <span class="telling">
      <span class="pil goed" id="pGoed">0 goed</span>
      <span class="pil af" id="pAf">0 afgekeurd</span>
      <span class="pil" id="pTeDoen">0 te keuren</span>
    </span>
  </header>

  <main>
    <div id="inlog" hidden>
      <p class="melding">Vul je ADMIN_TOKEN in om te kunnen keuren.</p>
      <div class="token">
        <input id="tokenVeld" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
        <button id="tokenOk">Opslaan</button>
      </div>
    </div>

    <div id="werk" hidden>
      <div class="doek"><div id="speler"></div></div>

      <div class="info">
        <span class="naam" id="naam">—</span>
        <span class="tegen" id="tegen"></span>
        <span class="meta" id="meta"></span>
      </div>

      <div class="knoppen">
        <button class="af groei" id="bAf">✗ Afkeuren <kbd>←</kbd></button>
        <button class="goed groei" id="bGoed">✓ Goedkeuren <kbd>→</kbd></button>
      </div>
      <div class="knoppen">
        <button id="bVroeger">Start −5s <kbd>[</kbd></button>
        <button id="bLater">Start +5s <kbd>]</kbd></button>
        <button id="bResetStart">Start standaard <kbd>0</kbd></button>
        <button id="bEindVroeger">Eind −5s <kbd>,</kbd></button>
        <button id="bEindLater">Eind +5s <kbd>.</kbd></button>
        <button id="bResetEind">Eind standaard <kbd>/</kbd></button>
      </div>
      <div class="knoppen">
        <span class="snelheid">Snelheid:</span>
        <button class="snelknop actief" id="bS1">1× <kbd>1</kbd></button>
        <button class="snelknop" id="bS2">2× <kbd>2</kbd></button>
        <button class="snelknop" id="bS4">4× <kbd>3</kbd></button>
        <button id="bNaarEind">⏭ Naar het eind <kbd>E</kbd></button>
        <button id="bOpnieuw">↻ Opnieuw <kbd>R</kbd></button>
        <button id="bVorige">‹ Vorige <kbd>P</kbd></button>
      </div>

      <div class="balk"><span id="balk"></span></div>
      <div class="voortgang" id="voortgang">—</div>

      <label class="rij-filter">
        <input type="checkbox" id="fAlles"> Ook al gekeurde clips tonen
      </label>
    </div>

    <div id="tabel" hidden>
      <div class="filterbalk">
        <select id="fStatus">
          <option value="">Alle statussen</option>
          <option value="te keuren">Te keuren</option>
          <option value="goed">Goedgekeurd</option>
          <option value="afgekeurd">Afgekeurd</option>
        </select>
        <input id="fZoek" type="search" placeholder="Zoek speler of toernooi…">
        <span id="tabelTelling" class="tabelinfo"></span>
      </div>
      <div class="tabelwrap">
        <table class="clips">
          <thead><tr>
            <th></th><th>Start</th><th>Eind</th><th>Duur</th><th>Spelers</th>
            <th>Toernooi</th><th>Datum</th><th>Status</th>
          </tr></thead>
          <tbody id="tabelBody"></tbody>
        </table>
      </div>
    </div>

    <div class="melding" id="melding">Laden…</div>
  </main>

<script>
// Keuringspagina voor de highlight-clips (#71). Niet elke run-out levert bruikbaar beeld op
// — soms staat het pauzescherm in beeld of kijkt de camera de verkeerde kant op. Hier loop
// je ze één voor één door en keur je ze goed of af; de uitzending speelt daarna alleen wat
// is goedgekeurd.
//
// Auth: hetzelfde admin-token als het dashboard (localStorage-sleutel mokum_admin_token),
// dus wie daar al ingelogd is hoeft hier niets in te vullen. Het token staat NOOIT in de
// code — het wordt eenmalig ingevuld en lokaal bewaard.
const API = 'https://mokum-streams-func.azurewebsites.net';
const TOKEN_KEY = 'mokum_admin_token';

const $ = (id) => document.getElementById(id);
const token = () => localStorage.getItem(TOKEN_KEY) || '';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let alle = [];      // alle clips met hun oordeel
let lijst = [];     // wat we nu doorlopen (afhankelijk van het filter)
let idx = 0;
let speler = null;
let snelheid = 1;   // afspeelsnelheid tijdens het keuren (1× / 2× / 4×)
let turbo = null;   // timer die 4× nabootst (zie pasSnelheidToe)
const EIND_KIJK = 5; // seconden vóór het clip-einde waar "Naar het eind" naartoe springt
const CLIP_NA = 4;  // naloop-seconden na het rack (== CLIP_NA_SEC in de backend) — voor 'Eind standaard'

const datumKort = (iso) => {
  const d = new Date(`${iso}T12:00:00Z`);
  return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' });
};
// Seconden → m:ss (of h:mm:ss). Voor de tijd-kolommen in de tabel.
const mmss = (sec) => {
  if (sec == null || Number.isNaN(Number(sec))) return '—';
  const s = Math.max(0, Math.round(sec));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return `${h > 0 ? `${h}:${String(m).padStart(2, '0')}` : m}:${String(r).padStart(2, '0')}`;
};
// Accent-ongevoelig zoeken.
const norm = (s) => String(s || '').normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();

async function api(pad, opts = {}) {
  const res = await fetch(`${API}${pad}`, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token()}`, ...(opts.headers || {}) },
  });
  if (!res.ok) {
    const fout = new Error(`HTTP ${res.status}`);
    fout.status = res.status;
    throw fout;
  }
  return res.json();
}

function tellingTonen(t) {
  $('pGoed').textContent = `${t.goed} goed`;
  $('pAf').textContent = `${t.afgekeurd} afgekeurd`;
  $('pTeDoen').textContent = `${t.tekeuren} te keuren`;
  const gedaan = t.goed + t.afgekeurd;
  $('balk').style.width = t.totaal ? `${(gedaan / t.totaal) * 100}%` : '0';
}

function bouwLijst() {
  lijst = $('fAlles').checked ? alle : alle.filter((c) => c.keuring === null);
  if (idx >= lijst.length) idx = Math.max(0, lijst.length - 1);
}

function toon() {
  if (!lijst.length) {
    $('melding').hidden = false;
    $('melding').textContent = $('fAlles').checked
      ? 'Geen clips gevonden.'
      : 'Alles gekeurd. Zet het vinkje aan om je eerdere oordelen te herzien.';
    $('werk').hidden = true;
    return;
  }
  $('melding').hidden = true;
  $('werk').hidden = false;

  const c = lijst[idx];
  $('naam').textContent = c.speler;
  $('tegen').textContent = `tegen ${c.tegenstander || '?'}${c.ronde ? ` · ${c.ronde}` : ''}`;
  metaTonen(c);
  $('voortgang').textContent = `${idx + 1} van ${lijst.length}`;
  laadClip(c);
}

// Bouwt de meta-regel (toernooi, datum, clip-lengte + start/eind-aanpassingen + oordeel).
function metaTonen(c) {
  const startLabel = c.startAangepast ? ` · start +${c.clipVan - c.offsetSec}s` : '';
  const eindStd = c.eindSec != null ? c.eindSec + CLIP_NA : c.clipTot;
  const dEind = c.clipTot - eindStd;
  const eindLabel = c.eindAangepast ? ` · eind ${dEind >= 0 ? '+' : ''}${dEind}s` : '';
  $('meta').innerHTML = `${esc(c.toernooi || '')}<br>${esc(datumKort(c.datum))} · tafel ${esc(c.tafel)} · ${c.clipTot - c.clipVan}s${startLabel}${eindLabel}${c.keuring ? ` · <b>${esc(c.keuring)}</b>` : ''}`;
}

// Laadt de huidige clip in de speler (met het clipvenster) en herstelt de afspeelsnelheid.
// `vanaf` is optioneel: laat de clip op een andere seconde beginnen (bijv. vlak vóór het eind).
function laadClip(c, vanaf) {
  if (!speler || !speler.loadVideoById) return;
  const start = vanaf == null ? c.clipVan : Math.max(c.clipVan, Math.min(vanaf, c.clipTot - 1));
  speler.loadVideoById({ videoId: c.videoId, startSeconds: start, endSeconds: c.clipTot });
  pasSnelheidToe();
}

// Springt naar de laatste seconden van de clip, zodat je meteen ziet of het eindpunt goed
// valt zonder de hele run-out af te wachten.
function naarEind() {
  const c = lijst[idx];
  if (!c || !speler || !speler.seekTo) return;
  speler.seekTo(Math.max(c.clipVan, c.clipTot - EIND_KIJK), true);
  if (speler.playVideo) speler.playVideo();
}

// Afspeelsnelheid kiezen (1× / 2× / 4×) + de actieve knop markeren.
function setSnelheid(rate) {
  snelheid = rate;
  pasSnelheidToe();
  for (const [id, r] of [['bS1', 1], ['bS2', 2], ['bS4', 4]]) {
    const b = $(id); if (b) b.classList.toggle('actief', r === rate);
  }
}

// De YouTube-speler gaat zelf niet hoger dan 2×. Voor 4× draaien we dus op 2× en springen
// we er elke seconde nóg 2 seconden bovenop — netto ongeveer vier keer zo snel, alleen met
// zichtbare sprongetjes. Prima om doorheen te scannen, niet om rustig te kijken.
function pasSnelheidToe() {
  if (speler && speler.setPlaybackRate) speler.setPlaybackRate(Math.min(snelheid, 2));
  if (snelheid <= 2) { clearInterval(turbo); turbo = null; return; }
  if (turbo) return;
  turbo = setInterval(() => {
    if (!speler || !speler.getCurrentTime || speler.getPlayerState() !== YT.PlayerState.PLAYING) return;
    const c = lijst[idx];
    const doel = speler.getCurrentTime() + (snelheid - 2);
    if (!c || doel > c.clipTot - 1) return;  // laatste seconden gewoon op 2× uitkijken
    speler.seekTo(doel, true);
  }, 1000);
}

// Vangnet: na een sprong houdt YouTube het ingestelde clip-einde niet altijd vast, dus
// zetten we de speler zelf stil zodra we voorbij het einde van de clip zijn.
function bewaakEinde() {
  setInterval(() => {
    const c = lijst[idx];
    if (!c || !speler || !speler.getCurrentTime) return;
    if (speler.getPlayerState() !== YT.PlayerState.PLAYING) return;
    if (speler.getCurrentTime() > c.clipTot + 0.5) speler.pauseVideo();
  }, 400);
}

async function keur(status) {
  const c = lijst[idx];
  if (!c) return;
  try {
    const t = await api('/api/manage/highlights', { method: 'POST', body: JSON.stringify({ sleutel: c.sleutel, status }) });
    c.keuring = t.status;
    tellingTonen(t);
  } catch (e) {
    $('meta').innerHTML = `<span class="fout">opslaan mislukt (${esc(e.message)})</span>`;
    return;
  }
  // Bij "alles tonen" blijven we staan zodat je je oordeel ziet; anders door naar de volgende.
  if ($('fAlles').checked) { volgende(); return; }
  bouwLijst();
  toon();
}

function volgende() { if (idx < lijst.length - 1) idx += 1; toon(); }
function vorige()   { if (idx > 0) idx -= 1; toon(); }

// Startseconde bijstellen. `delta` = seconden t.o.v. de HUIDIGE start; null = terug naar
// het standaard-venster (vanaf het rack-moment).
async function schuifStart(delta) {
  const c = lijst[idx];
  if (!c) return;
  const start = delta == null ? null
    : Math.max(c.offsetSec, Math.min((c.clipVan || c.offsetSec) + delta, c.clipTot - 5));
  try {
    await api('/api/manage/highlights', { method: 'POST', body: JSON.stringify({ sleutel: c.sleutel, start }) });
    c.clipVan = start == null ? c.offsetSec : start;
    c.startAangepast = start != null;
    laadClip(c);
    metaTonen(c);
  } catch (e) {
    $('meta').innerHTML = `<span class="fout">start opslaan mislukt (${esc(e.message)})</span>`;
  }
}

// Eindseconde van het clipvenster bijstellen. delta = seconden t.o.v. het HUIDIGE einde;
// null = terug naar het standaard-einde (rack-einde + naloop). Nooit vóór de start.
async function schuifEind(delta) {
  const c = lijst[idx];
  if (!c) return;
  const standaard = c.eindSec != null ? c.eindSec + CLIP_NA : c.clipTot;
  const eind = delta == null ? null
    : Math.max((c.clipVan || 0) + 3, (c.clipTot || 0) + delta);
  try {
    await api('/api/manage/highlights', { method: 'POST', body: JSON.stringify({ sleutel: c.sleutel, eind }) });
    c.clipTot = eind == null ? standaard : eind;
    c.eindAangepast = eind != null;
    laadClip(c, c.clipTot - EIND_KIJK);  // meteen het nieuwe eind laten zien
    metaTonen(c);
  } catch (e) {
    $('meta').innerHTML = `<span class="fout">eind opslaan mislukt (${esc(e.message)})</span>`;
  }
}

// ── Tabel-overzicht (alle clips, filterbaar) ──────────────────────────────────
const clipStatus = (c) => c.keuring || 'te keuren';

function renderTabel() {
  const statusF = $('fStatus').value;
  const zoek = norm($('fZoek').value.trim());
  const rows = alle.filter((c) => {
    if (statusF && clipStatus(c) !== statusF) return false;
    if (zoek && !norm(`${c.speler} ${c.tegenstander || ''} ${c.toernooi || ''}`).includes(zoek)) return false;
    return true;
  });
  const badge = (c) => {
    const st = clipStatus(c);
    const cls = st === 'goed' ? 'goed' : st === 'afgekeurd' ? 'af' : 'open';
    const label = st === 'goed' ? 'Goed' : st === 'afgekeurd' ? 'Afgekeurd' : 'Te keuren';
    return `<span class="stat ${cls}">${label}</span>`;
  };
  $('tabelBody').innerHTML = rows.map((c) => {
    const link = `https://youtu.be/${esc(c.videoId)}?t=${Math.floor(c.clipVan || 0)}`;
    const aangepast = (c.startAangepast || c.eindAangepast) ? ' class="aangepast"' : '';
    return `<tr data-sleutel="${esc(c.sleutel)}"${aangepast}>
        <td><a class="kijk" href="${link}" target="_blank" rel="noopener" title="Bekijk op YouTube" onclick="event.stopPropagation()">▶</a></td>
        <td class="tijd">${mmss(c.clipVan)}</td>
        <td class="tijd">${mmss(c.clipTot)}</td>
        <td class="tijd">${mmss((c.clipTot || 0) - (c.clipVan || 0))}</td>
        <td>${esc(c.speler)} <span style="color:#777">vs</span> ${esc(c.tegenstander || '?')}</td>
        <td>${esc(c.toernooi || '')}</td>
        <td>${esc(datumKort(c.datum))}</td>
        <td>${badge(c)}</td>
      </tr>`;
  }).join('');
  $('tabelTelling').textContent = `${rows.length} van ${alle.length} clips`;
  for (const tr of $('tabelBody').querySelectorAll('tr')) {
    tr.onclick = () => { const c = alle.find((x) => x.sleutel === tr.dataset.sleutel); if (c) openClip(c); };
  }
}

// Open één clip in de keur-weergave (om 'm te bekijken/bijstellen).
function openClip(c) {
  $('fAlles').checked = true;
  bouwLijst();
  const i = lijst.findIndex((x) => x.sleutel === c.sleutel);
  if (i >= 0) idx = i;
  zetView('keuren');
  toon();
}

function zetView(view) {
  const tabel = view === 'tabel';
  $('tabel').hidden = !tabel;
  $('bView').textContent = tabel ? '◀ Terug naar keuren' : '📋 Overzicht';
  if (tabel) { $('werk').hidden = true; $('melding').hidden = true; renderTabel(); }
  else { toon(); }
}

function koppel() {
  $('bGoed').onclick = () => keur('goed');
  $('bAf').onclick = () => keur('afgekeurd');
  $('bVorige').onclick = vorige;
  $('bOpnieuw').onclick = toon;
  $('bLater').onclick = () => schuifStart(5);
  $('bVroeger').onclick = () => schuifStart(-5);
  $('bResetStart').onclick = () => schuifStart(null);
  $('bEindLater').onclick = () => schuifEind(5);
  $('bEindVroeger').onclick = () => schuifEind(-5);
  $('bResetEind').onclick = () => schuifEind(null);
  $('bS1').onclick = () => setSnelheid(1);
  $('bS2').onclick = () => setSnelheid(2);
  $('bS4').onclick = () => setSnelheid(4);
  $('bNaarEind').onclick = naarEind;
  $('bView').onclick = () => zetView($('tabel').hidden ? 'tabel' : 'keuren');
  $('fStatus').onchange = renderTabel;
  $('fZoek').oninput = renderTabel;
  $('fAlles').onchange = () => { idx = 0; bouwLijst(); toon(); };
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'j') { e.preventDefault(); keur('goed'); }
    if (e.key === 'ArrowLeft'  || e.key.toLowerCase() === 'n') { e.preventDefault(); keur('afgekeurd'); }
    if (e.key.toLowerCase() === 'r') toon();
    if (e.key.toLowerCase() === 'p') vorige();
    if (e.key.toLowerCase() === 'e') { e.preventDefault(); naarEind(); }
    if (e.key === ']') { e.preventDefault(); schuifStart(5); }
    if (e.key === '[') { e.preventDefault(); schuifStart(-5); }
    if (e.key === '0') { e.preventDefault(); schuifStart(null); }
    if (e.key === '.') { e.preventDefault(); schuifEind(5); }
    if (e.key === ',') { e.preventDefault(); schuifEind(-5); }
    if (e.key === '/') { e.preventDefault(); schuifEind(null); }
    if (e.key === '1') setSnelheid(1);
    if (e.key === '2') setSnelheid(2);
    if (e.key === '3') setSnelheid(4);
  });
}

function startSpeler() {
  speler = new YT.Player('speler', {
    width: '100%', height: '100%',
    playerVars: { autoplay: 1, mute: 1, controls: 1, modestbranding: 1, rel: 0, playsinline: 1 },
    events: {
      onReady: () => { toon(); bewaakEinde(); },
      // Snelheid opnieuw zetten zodra de nieuwe clip speelt (loadVideoById reset 'm soms).
      onStateChange: (e) => { if (e.data === YT.PlayerState.PLAYING) pasSnelheidToe(); },
    },
  });
}

async function laden() {
  try {
    const d = await api('/api/manage/highlights');
    alle = d.items || [];
    tellingTonen(d);
    bouwLijst();
    $('bView').hidden = false;
    renderTabel();
    $('inlog').hidden = true;
    window.onYouTubeIframeAPIReady = startSpeler;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  } catch (e) {
    $('melding').hidden = false;
    // Alleen bij een ECHTE auth-fout (401 = ongeldig/ontbrekend token) het inlogvak tonen.
    // Elke andere fout (netwerkhapering, backend net aan het deployen, een 5xx) liet
    // eerder óók het inlogvak zien — dan lijkt het alsof het token weg is, terwijl het
    // gewoon in localStorage stond. Dat leidde tot onnodig steeds opnieuw intikken.
    if (e.status === 401) {
      $('melding').innerHTML = '<span class="fout">Token ongeldig of verlopen — vul het opnieuw in.</span>';
      $('inlog').hidden = false;
    } else {
      $('melding').innerHTML = `<span class="fout">Kon de clips niet laden (${esc(e.message)}). </span>`
        + `<a href="#" id="opnieuwLink">Probeer opnieuw</a>`;
      $('opnieuwLink').onclick = (ev) => { ev.preventDefault(); $('melding').textContent = 'Laden…'; laden(); };
    }
  }
}

(function start() {
  koppel();
  $('tokenOk').onclick = () => {
    localStorage.setItem(TOKEN_KEY, $('tokenVeld').value.trim());
    $('tokenVeld').value = '';
    $('melding').textContent = 'Laden…';
    laden();
  };
  if (!token()) {
    $('melding').hidden = true;
    $('inlog').hidden = false;
    return;
  }
  laden();
})();
</script>
