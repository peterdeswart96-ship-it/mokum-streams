<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Mokum Live</title>
<link rel="icon" href="/mokum-logo.png">
<link rel="apple-touch-icon" href="/mokum-logo.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Mokum standen">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Arial, Helvetica, sans-serif;
    background: #0a0a0a; color: #cccccc; -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    background: #1a1a1a;
    padding: 14px 16px; border-bottom: 1px solid #2a2a2a;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
  }
  header h1 { margin: 0; font-size: 18px; font-family: "Arial Black", Arial, sans-serif; letter-spacing: .2px; color: #fff; }
  header h1 .m { color: #cc0000; }
  header .sub { font-size: 12px; color: #999; margin-top: 2px; }
  /* Gecentreerde paginatitel in de bovenbalk (zelfde stijl als de rest). */
  .kop-titel { text-align: center; }
  .kop-titel .titel { font-family: "Arial Black", Arial, sans-serif; font-size: 22px; color: #fff; line-height: 1.05; }
  .kop-titel .titel .m { color: #cc0000; }
  .kop-titel .titel-sub { font-size: 12px; color: #999; margin-top: 3px; }
  @media (max-width: 620px) {
    header .bar > div { display: none; } /* op smal scherm alleen het logo links */
    .kop-titel .titel { font-size: 18px; }
  }
  main { padding: 12px 12px 40px; max-width: 640px; margin: 0 auto; }
  .melding { color: #999; text-align: center; padding: 40px 16px; font-size: 15px; }
  .sectiekop { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: #999; margin: 16px 4px 8px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #cc0000; box-shadow: 0 0 0 4px rgba(204,0,0,.2); }

  /* Live-gloed: langzaam pulserende rode omlijning op wat NU speelt. */
  @keyframes gloed {
    0%, 100% { box-shadow: 0 0 0 1px #cc0000, 0 0 6px rgba(204,0,0,.30); }
    50%      { box-shadow: 0 0 0 1px #ff3b3b, 0 0 18px rgba(204,0,0,.75); }
  }
  @media (prefers-reduced-motion: reduce) { .kaart.live, .mrij.live { animation: none; } }

  /* Standaard-weergave: kaarten. Niet-live tafels krijgen géén omlijning. */
  .kaart {
    background: #1a1a1a; border: 1px solid transparent; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .kaart.live { border-color: #cc0000; animation: gloed 2.4s ease-in-out infinite; }
  .kaart.klaar { opacity: .55; }
  .kaart .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .tafel { font-family: "Arial Black", Arial, sans-serif; font-size: 13px; background: #2a2a2a; color: #fff; border-radius: 6px; padding: 3px 9px; }
  .toernooi { font-size: 11px; color: #999; text-align: right; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rij { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .speler { font-size: 15px; font-weight: bold; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .speler.b { text-align: right; }
  /* Score altijd gecentreerd rond het streepje: beide helften even breed. */
  .score { font-size: 20px; font-family: "Arial Black", Arial, sans-serif; color: #fff; display: inline-flex; align-items: baseline; justify-content: center; }
  .score .sa { min-width: 28px; text-align: right; }
  .score .sb { min-width: 28px; text-align: left; }
  .score .sep { color: #666; margin: 0 4px; }
  .raceto { text-align: center; font-size: 11px; color: #999; margin-top: 6px; }
  .kijk {
    display: inline-block; margin-top: 8px; font-size: 12px; font-weight: bold;
    color: #ff6b6b; text-decoration: none;
  }
  .kijk:hover { color: #cc0000; }

  /* Minimal-weergave: één compacte regel per wedstrijd. Links (tafel + speler A) en
     rechts (speler B + 📺) zijn even breed (flex:1) zodat de score altijd exact in het
     midden staat, ongeacht de breedte van het tafelnummer of het 📺-icoon. */
  .mrij {
    display: flex; align-items: center; gap: 10px;
    background: #1a1a1a; border: 1px solid transparent; border-radius: 8px;
    padding: 8px 10px; margin-bottom: 6px;
  }
  /* Toernooikleur (--tk): een gekleurde balk links, zodat je ziet bij welk toernooi of welke
     competitie een stand hoort. De rode rand/gloed blijft voor "live op onze YouTube". */
  .tkdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--tk, #666); margin-right: 7px; }
  .mrij.live { border-color: #cc0000; animation: gloed 2.4s ease-in-out infinite; }
  .mrij.klaar { opacity: .55; }
  .mrij.wacht { opacity: .68; } /* staat klaar, nog niet begonnen → gedimd */
  .sdot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .sdot.spelen { background: #cc0000; box-shadow: 0 0 0 3px rgba(204,0,0,.22); }
  .sdot.straks { background: #7a7a7a; }
  .mrij .helft { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .mrij .helft.rechts { justify-content: flex-end; }
  .mrij .mt { flex: 0 0 auto; font-family: "Arial Black", Arial, sans-serif; font-size: 12px; background: #2a2a2a; color: #fff; border-radius: 5px; padding: 2px 7px; }
  .mrij .ma { flex: 1 1 auto; min-width: 0; font-size: 14px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrij .mb { flex: 0 1 auto; min-width: 0; font-size: 14px; color: #fff; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrij .ms { flex: 0 0 auto; font-size: 15px; font-family: "Arial Black", Arial, sans-serif; color: #fff; display: inline-flex; align-items: baseline; }
  .mrij .ms .sa { min-width: 20px; text-align: right; }
  .mrij .ms .sb { min-width: 20px; text-align: left; }
  .mrij .ms .sep { color: #666; margin: 0 4px; }
  .mrij .mk { flex: 0 0 auto; text-decoration: none; font-size: 15px; line-height: 1; }

  /* Pin-knop om een tafel vast te pinnen. Los = grijze omtrek, schuin gekanteld;
     gepind = massief rood en rechtop. SVG zodat we de kleur écht kunnen sturen. */
  .pin { flex: 0 0 auto; cursor: pointer; background: none; border: 0; padding: 3px; line-height: 0; color: #8a8a8a; transform: rotate(-30deg); transition: transform .15s ease, color .15s ease; }
  .pin svg { width: 17px; height: 17px; display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .pin:hover { color: #ff6b6b; }
  .pin.aan { color: #cc0000; transform: rotate(0deg); }
  .pin.aan svg { fill: currentColor; }
  .top .tafelwrap { display: inline-flex; align-items: center; gap: 4px; }

  /* Livestream-paneel onder de standen (zelfde stijl als het dashboard). */
  .stream { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 14px; margin-top: 22px; }
  .streamkop { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .streamkop h2 { margin: 0; font-family: "Arial Black", Arial, sans-serif; font-size: 18px; color: #fff; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  /* Elke cameratafel een eigen lichte pastelkleur (--pc). Gekozen tafel = witte ring + vet;
     een tafel zonder livestream is gedimd. Het rode bolletje pulseert bij een live tafel. */
  .tab { cursor: pointer; display: inline-flex; align-items: center; gap: 8px; background: var(--pc, #ddd); border: 0; border-radius: 10px; color: #14202b; font: inherit; font-size: 15px; font-weight: bold; padding: 9px 15px; opacity: .72; filter: saturate(.6); }
  .tab:hover { opacity: .9; filter: none; }
  .tab.live { opacity: 1; filter: none; }
  .tab .tabdot { width: 9px; height: 9px; border-radius: 50%; background: #cc0000; animation: tabpuls 1.6s ease-in-out infinite; }
  .tab.aan { opacity: 1; box-shadow: 0 0 0 3px #fff; }
  @keyframes tabpuls { 0%, 100% { box-shadow: 0 0 0 0 rgba(204,0,0,.6); } 50% { box-shadow: 0 0 0 6px rgba(204,0,0,0); } }
  @media (prefers-reduced-motion: reduce) { .tab .tabdot { animation: none; } }
  .video { position: relative; width: 100%; padding-top: 56.25%; border-radius: 8px; overflow: hidden; background: #000; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .geenstream { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #999; font-size: 14px; text-align: center; padding: 20px; }
  .streamhint { font-size: 11px; color: #666; margin-top: 8px; }

  footer { text-align: center; color: #666; font-size: 11px; padding: 8px 16px 24px; }
  footer a { color: #999; }
  .bar { display: flex; align-items: center; gap: 12px; }
  .logo { height: 40px; width: auto; flex: none; }
  .zoek {
    width: 100%; box-sizing: border-box; margin: 4px 0 4px; padding: 10px 12px;
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
    color: #fff; font-size: 15px; font-family: inherit;
  }
  .zoek::placeholder { color: #777; }

  /* Werkbalk: filterknop links, weergave-schakelaar rechts. */
  .toolbar { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; }
  .toolbar .spacer { flex: 1; }
  /* Toernooi-ticker: de toernooinaam scrolt langzaam voorbij (bespaart ruimte). */
  .ticker { flex: 1 1 0; min-width: 60px; overflow: hidden; height: 34px; display: flex; align-items: center; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; }
  .tickertrack { display: inline-flex; white-space: nowrap; will-change: transform; animation: tickerscroll linear infinite; }
  .tickertrack span { padding: 0 22px; color: #cbd5e1; font-size: 13px; }
  .ticker:hover .tickertrack { animation-play-state: paused; }
  @keyframes tickerscroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .tickertrack { animation: none; } }
  .knop {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px;
    color: #ccc; font: inherit; font-size: 13px; padding: 8px 11px;
  }
  .knop:hover { color: #fff; border-color: #3a3a3a; }
  .knop.actief { border-color: #cc0000; color: #fff; }
  .knop .telpil { background: #cc0000; color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; font-weight: bold; }
  /* Segment-schakelaar (Standaard | Minimal). */
  .seg { display: inline-flex; border: 1px solid #2a2a2a; border-radius: 8px; overflow: hidden; }
  .seg button { cursor: pointer; background: #1a1a1a; border: 0; color: #999; font: inherit; font-size: 13px; font-weight: bold; padding: 8px 12px; text-align: center; }
  .seg button.aan { background: #cc0000; color: #fff; }
  .seg .xl-knop { display: none; } /* XL is alleen voor desktop */

  /* XL-weergave (alleen desktop ≥1000px): links een strook met filters + standen,
     rechts een grote, zo beeldvullend mogelijke livestream. */
  @media (min-width: 1000px) {
    .seg .xl-knop { display: block; }
    /* Volle breedte gebruiken: smalle strook links, de rest voor de livestream. */
    body.xl main { max-width: none; width: 100%; display: grid; grid-template-columns: minmax(520px, 620px) 1fr; gap: 18px; align-items: start; padding: 12px 18px 24px; }
    body.xl #kolomlinks { min-width: 0; }
    body.xl #streampaneel { margin-top: 0; position: sticky; top: 16px; }
    body.xl .streamkop h2 { font-size: 30px; }
    /* Bredere strook links, met veel grotere namen en knoppen (leesbaar op afstand/tv). */
    body.xl .zoek { font-size: 18px; padding: 14px 16px; }
    body.xl .chip { font-size: 16px; padding: 10px 17px; }
    body.xl .tog { font-size: 16px; padding: 10px 15px; }
    body.xl .seg button { font-size: 16px; padding: 11px 16px; }
    body.xl .tcard h3 { font-size: 19px; padding: 12px 14px; }
    body.xl .tcard h3 .tt { font-size: 15px; }
    body.xl .mrij { padding: 14px 14px; gap: 12px; }
    body.xl .mrij .ma, body.xl .mrij .mb { font-size: 20px; }
    body.xl .mrij .ms { font-size: 26px; }
    body.xl .mrij .mt { font-size: 17px; padding: 3px 10px; }
    body.xl .mrij .mk { font-size: 22px; }
    body.xl .sdot { width: 10px; height: 10px; }
    body.xl .pin svg { width: 22px; height: 22px; }
    /* Bovenbalk 2x zo groot: logo, titel en het hamburgermenu (knop komt uit /site-nav.js). */
    body.xl header { padding: 14px 24px; }
    body.xl .logo { height: 80px; }
    body.xl .kop-titel .titel { font-size: 44px; }
    body.xl .kop-titel .titel-sub { font-size: 24px; margin-top: 6px; }
    body.xl #mokumnav-knop { width: 80px; height: 80px; font-size: 36px; border-radius: 18px; top: 14px; right: 24px; }
    body.xl #mokumnav-paneel { top: 104px; right: 24px; width: 420px; }
    body.xl #mokumnav-paneel .mokumnav-rij .naam { font-size: 18px; }
    body.xl #mokumnav-paneel .mokumnav-rij .omschrijving { font-size: 14px; }
    /* Tafel-tabs 2x zo groot. */
    body.xl .tabs { gap: 14px; }
    body.xl .tab { font-size: 28px; padding: 18px 30px; border-radius: 16px; gap: 14px; }
    body.xl .tab .tabdot { width: 16px; height: 16px; }
    body.xl .tab.aan { box-shadow: 0 0 0 4px #fff; }
    /* Video zo groot mogelijk: het grootste 16:9-vlak dat in de resterende breedte
       én de schermhoogte past (voorkomt zwarte balken en loze ruimte). */
    /* Cap op 1920px (native 1080p): niet groter uitrekken dan de bron → blijft scherp. */
    body.xl .video { padding-top: 0; aspect-ratio: 16 / 9; width: min(100%, calc((100vh - 340px) * 16 / 9)); max-width: 1920px; margin: 0 auto; }
  }

  /* Toernooi-chips: één tik = alleen dat toernooi, "Alles" = alles. Kleur = toernooikleur. */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 8px; }
  .chip { cursor: pointer; display: inline-flex; align-items: center; gap: 7px; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 999px; color: #ddd; font: inherit; font-size: 13px; padding: 7px 13px; }
  .chip:hover { border-color: #3a3a3a; color: #fff; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--tk, #888); flex: none; }
  .chip.aan { border-color: var(--tk, #888); background: color-mix(in srgb, var(--tk, #888) 20%, #1a1a1a); color: #fff; font-weight: bold; }
  /* Aan/uit-knoppen voor de filters. */
  .toolbar { flex-wrap: wrap; justify-content: space-between; }
  .toggles { display: flex; flex-wrap: wrap; gap: 6px; }
  .tog { cursor: pointer; background: #141414; border: 1px solid #2a2a2a; border-radius: 8px; color: #aaa; font: inherit; font-size: 13px; padding: 7px 11px; }
  .tog:hover { color: #fff; border-color: #3a3a3a; }
  .tog[aria-pressed="true"] { background: #cc0000; border-color: #cc0000; color: #fff; }
  /* Toernooikaart: gekleurde kop, daaronder de wedstrijden van dat toernooi. */
  .tcard { background: #141414; border: 1px solid #2a2a2a; border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .tcard h3 { margin: 0; padding: 9px 12px; font-size: 14px; color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: color-mix(in srgb, var(--tk) 22%, #141414); border-bottom: 2px solid var(--tk); }
  .tcard h3 .tn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tcard h3 .tt { flex: none; font-weight: normal; font-size: 12px; color: #ccc; }
  .tcard .mrij { border-radius: 0; margin: 0; border: 0; border-bottom: 1px solid #222; background: transparent; }
  .tcard .mrij:last-child { border-bottom: 0; }
  /* Live op onze YouTube: rode omlijning die langzaam pulseert/gloeit. Inset, want de kaart
     knipt (overflow hidden) alles buiten de rij af. */
  @keyframes gloedIn {
    0%, 100% { box-shadow: inset 0 0 0 2px #cc0000, inset 0 0 8px rgba(204,0,0,.35); background: rgba(204,0,0,.08); }
    50%      { box-shadow: inset 0 0 0 2px #ff3b3b, inset 0 0 24px rgba(255,59,59,.65); background: rgba(204,0,0,.18); }
  }
  .tcard .mrij.live { animation: gloedIn 2.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .tcard .mrij.live { animation: none; box-shadow: inset 0 0 0 2px #cc0000; } }
  .tcard .mrij .mt { background: var(--tk); color: #06121f; }
  .tcard .mrij.klaar .mt { opacity: .8; }

</style>
</head>
<body>
  <header>
    <div class="bar">
      <img class="logo" src="/mokum-logo.png" alt="Mokum Pool & Darts">
    </div>
    <div class="kop-titel">
      <div class="titel"><span class="m">Mokum</span> Live</div>
      <div class="titel-sub">Standen en livestreams</div>
    </div>
  </header>
  <main>
    <div id="kolomlinks">
    <input id="zoek" class="zoek" type="search" placeholder="Zoek speler of tafel…" autocomplete="off">
    <div id="chips" class="chips" role="group" aria-label="Toernooi"></div>
    <div class="toolbar">
      <div class="toggles" role="group" aria-label="Filters">
        <button id="tYoutube" class="tog" type="button" aria-pressed="false" title="Alleen wedstrijden die live op YouTube staan">▶ Op YouTube</button>
        <button id="tGepind" class="tog" type="button" aria-pressed="false" title="Alleen de tafels die je hebt vastgepind">📌 Gepind</button>
        <button id="tAfgelopen" class="tog" type="button" aria-pressed="false" title="Afgelopen wedstrijden verbergen">Verberg afgelopen</button>
      </div>
      <div class="seg" role="group" aria-label="Weergave">
        <button id="wMinimal" type="button" title="Klein — compacte lijst (mobiel)">📱S</button>
        <button id="wXL" type="button" class="xl-knop" title="XL — brede desktopweergave met grote livestream 🖥️">🖥️ XL</button>
      </div>
    </div>
    <div id="inhoud"><div class="melding">Laden…</div></div>
    </div>

    <section id="streampaneel" class="stream" hidden>
      <div class="streamkop">
        <h2>Livestream</h2>
        <div class="tabs" id="streamtabs"></div>
      </div>
      <div class="video" id="streamvideo"></div>
      <div class="streamhint">YouTube-vertraging ~10-30s — het beeld loopt iets achter op de zaal.</div>
    </section>
  </main>
  <footer>Bijgewerkt <span id="ts">—</span> · standen via Cuescore</footer>

<script>
  const VENUE = 60451687;
  const REFRESH_MS = 20000;
  const API = 'https://api.cuescore.com';
  const APP_API = 'https://mokum-streams-func.azurewebsites.net'; // onze backend (voor 'kijk live'-links)
  const CAMERAS = [1, 3, 15, 16]; // tafels met camera (zelfde als het dashboard)

  let STREAM_SEL = CAMERAS[0];       // gekozen tafel in het livestream-paneel
  let STREAM_VID_GETOOND = null;     // welk videoId nu in de iframe staat (om herladen te voorkomen)
  let streamAutoGekozen = false;     // eenmalig de eerste live tafel kiezen

  let ALLE = [];     // alle wedstrijden van vandaag (met _toernooi)
  let STREAMS = {};  // { "<tafelnr>": youtube-videoId } — welke tafels wij live streamen
  let GELADEN = false;
  let TOERNOOINAMEN = [];         // gestreamde (live) toernooien vandaag — voor auto-keuze
  let TOERNOOIEN_VANDAAG = [];    // álle toernooinamen van vandaag — voor de dropdown
  let TOERNOOI_OPTS_SIG = '';     // handtekening van de dropdown-opties (om onnodig herbouwen te vermijden)
  let TICKER_GETOOND = null;      // welke tekst nu in de ticker staat (om herstart te voorkomen)

  // Weergave + filters, onthouden in de browser (localStorage).
  const LS_WEERGAVE = 'standen_weergave';
  const LS_FILTERS = 'standen_filters';
  const LS_PINS = 'standen_pins';
  const LS_TOERNOOI = 'standen_toernooi';
  // null = automatisch (het gestreamde/live toernooi), 'ALLE' = alle toernooien, of een
  // exacte toernooinaam.
  let TOERNOOIKEUZE = null;
  let WEERGAVE = 'minimal'; // 'standaard' | 'minimal' — minimal is de standaard
  let FILTERS = { afgelopen: false, youtube: false, gepind: false };
  let PINS = new Set(); // vastgepinde tafelnummers (jouw eigen favorieten)
  try {
    const w = localStorage.getItem(LS_WEERGAVE);
    if (w === 'minimal' || w === 'xl') WEERGAVE = w; // 'standaard' bestaat niet meer → valt terug op minimal
    const f = JSON.parse(localStorage.getItem(LS_FILTERS) || 'null');
    if (f && typeof f === 'object') FILTERS = { afgelopen: false, youtube: false, gepind: false, ...f };
    const p = JSON.parse(localStorage.getItem(LS_PINS) || '[]');
    if (Array.isArray(p)) PINS = new Set(p.map(Number).filter((n) => !Number.isNaN(n)));
    const tk = localStorage.getItem(LS_TOERNOOI);
    if (tk) TOERNOOIKEUZE = tk; // 'ALLE' of een toernooinaam
  } catch (e) { /* privacymodus e.d. → gewoon standaard */ }

  function bewaar() {
    try {
      localStorage.setItem(LS_WEERGAVE, WEERGAVE);
      localStorage.setItem(LS_FILTERS, JSON.stringify(FILTERS));
      localStorage.setItem(LS_PINS, JSON.stringify([...PINS]));
      if (TOERNOOIKEUZE == null) localStorage.removeItem(LS_TOERNOOI);
      else localStorage.setItem(LS_TOERNOOI, TOERNOOIKEUZE);
    } catch (e) { /* niet fataal */ }
  }

  // Welke toernooien tonen we nu? null = alle (geen filter). Volgorde: expliciete keuze
  // 'ALLE' → alle; een gekozen (nog bestaande) toernooinaam → alleen dat; anders
  // automatisch de gestreamde/live toernooien (venue-wide fallback als er niets live is).
  function toonToernooiSet() {
    if (TOERNOOIKEUZE && TOERNOOIKEUZE !== 'ALLE' && TOERNOOIEN_VANDAAG.includes(TOERNOOIKEUZE)) return new Set([TOERNOOIKEUZE]);
    return null; // alles — irrelevante toernooien zijn al weggefilterd bij het laden
  }

  const isPin = (tnr) => PINS.has(Number(tnr));
  function togglePin(tnr) {
    const n = Number(tnr);
    if (Number.isNaN(n)) return;
    if (PINS.has(n)) PINS.delete(n); else PINS.add(n);
    bewaar(); pasControlsToe(); render();
  }

  // Cookieloze bezoek-/QR-teller (#18 fase 1): meld één paginaweergave met de bron uit
  // utm_source (bv. 'qr' vanaf de QR-overlay). Fire-and-forget, geen cookies, geen
  // persoonsgegevens → geen consent-banner. Mag nooit de pagina blokkeren.
  (function meldBezoek() {
    try {
      const bron = new URLSearchParams(location.search).get('utm_source') || 'direct';
      const url = `${APP_API}/api/hit?source=${encodeURIComponent(bron)}&page=mokumlive`;
      if (navigator.sendBeacon) navigator.sendBeacon(url);
      else fetch(url, { method: 'POST', mode: 'no-cors', keepalive: true });
    } catch (e) { /* teller nooit fataal */ }
  })();

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const num = (s) => { const n = parseInt(String(s ?? '').replace(/\D/g, ''), 10); return Number.isNaN(n) ? 9999 : n; };
  // Zaal-dag i.p.v. kalenderdag (zelfde grens als backend/src/schedule/schedule.js
  // zaalDag(), ZAAL_DAG_GRENS_UUR=6): een toernooiavond loopt vaak door tot ná
  // middernacht, dus vóór 06:00 telt het nog als "gisteravond". Zonder deze correctie
  // vroeg de pagina Cuescore vlak na middernacht om de venue-events van de NIEUWE
  // kalenderdag op — een avondtoernooi dat nog bezig was viel dan uit de toernooi-
  // dropdown (geconstateerd 25-08 vlak na 00:00, #113-achtig maar aan de frontend-kant).
  const vandaag = () => {
    const d = new Date();
    if (d.getHours() < 6) d.setDate(d.getDate() - 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  async function haalJson(url) {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }

  // Zaal-dag van een tijdstip (zelfde 06:00-grens als vandaag()), in Amsterdamse tijd.
  const zaalDagVan = (iso) => {
    const t = Date.parse(iso || '');
    if (Number.isNaN(t)) return '';
    return new Date(t - 6 * 3600 * 1000).toLocaleDateString('sv-SE', { timeZone: 'Europe/Amsterdam' });
  };
  const wedstrijdStart = (m) => m.starttime || m.start || '';
  const isAfgerond = (t) => /^(afgerond|finished)$/i.test(String(t.status || '').trim());

  // Telt dit toernooi mee op de pagina? Niet afgerond, én er is vandaag iets lopend of
  // gespeeld/gepland. Zo vallen de 14.1-league (geen partij vandaag), de competitie in
  // november en een gisteren afgerond toernooi weg, maar blijft een toernooi dat nu speelt.
  function toernooiTelt(t) {
    if (isAfgerond(t)) return false;
    const dag = vandaag();
    return t.matches.some((m) => st(m) === 'playing' || zaalDagVan(wedstrijdStart(m)) === dag);
  }
  // Welke partijen van zo'n toernooi tonen we? Lopend altijd; wachtend als er geen starttijd
  // is (nog in te delen) of de start vandaag is; afgerond alleen van vandaag.
  function wedstrijdTelt(m) {
    const s = st(m);
    if (s === 'playing') return true;
    const dag = zaalDagVan(wedstrijdStart(m));
    if (s === 'waiting') return !dag || dag === vandaag();
    return dag === vandaag();
  }

  // Eén vaste kleur per toernooi (op naam, dus stabiel tussen verversingen). Geen rood: rood
  // betekent op deze pagina "live".
  const KLEUREN = ['#3b82f6', '#f59e0b', '#22c55e', '#a855f7', '#14b8a6', '#ec4899', '#eab308', '#06b6d4', '#84cc16'];
  let KLEUR = {}; // { toernooinaam: kleur }
  function bouwKleuren(namen) {
    const hash = (n) => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
    const bezet = new Set(); const uit = {};
    for (const n of [...namen].sort()) {
      let i = hash(n) % KLEUREN.length;
      for (let k = 0; k < KLEUREN.length && bezet.has(i); k++) i = (i + 1) % KLEUREN.length; // botsing → eerstvolgende vrije
      bezet.add(i); uit[n] = KLEUREN[i];
    }
    KLEUR = uit;
  }
  const kleurVan = (naam) => KLEUR[(naam || '').trim()] || '';

  async function laad() {
    try {
      // Onze eigen backend (voor de 'kijk live'-links + YouTube-filter + de toernooilijst).
      // Mag falen: dan werken we met alleen Cuescore's venue/events.
      const live = await haalJson(`${APP_API}/api/live`).catch(() => null);
      if (live) {
        const map = {};
        for (const t of (live.tables || [])) {
          // Alleen ÓPENBARE streams op de publieke pagina — verborgen/privé horen hier niet.
          const v = t.liveVisibility === 'public' ? t.liveVideoId : null;
          if (v) map[String(t.tableNumber)] = v;
        }
        STREAMS = map; renderStream();
      }

      // Toernooi-id's uit twee bronnen. Onze backend vindt het lopende toernooi altijd (via de
      // organisatiepagina); Cuescore's venue/events miste op 04-10 "Mokum Multiball 2". Daarom
      // samenvoegen i.p.v. kiezen: de ene bron vangt wat de andere mist.
      const ev = await haalJson(`${API}/venue/events/?venueId=${VENUE}&date=${vandaag()}`).catch(() => null);
      const ids = [...new Set([
        ...((live && Array.isArray(live.toernooien)) ? live.toernooien.map((t) => t.id) : []),
        ...((ev && Array.isArray(ev.events)) ? ev.events : []),
      ].filter((id) => id != null))];
      if (!live && !ev) throw new Error('geen bron bereikbaar');
      const toernooien = ids.length
        ? await Promise.all(ids.map((id) => haalJson(`${API}/tournament/?lang=nl&id=${id}`).catch(() => null)))
        : [];
      const matches = [];
      for (const t of toernooien) {
        if (!t || !Array.isArray(t.matches)) continue;
        // Afgeronde toernooien en oude leagues horen hier niet: alleen toernooien die niet
        // klaar zijn én vandaag iets spelen of gepland hebben (zie toernooiTelt).
        if (!toernooiTelt(t)) continue;
        for (const m of t.matches) { if (wedstrijdTelt(m)) { m._toernooi = t.name || ''; matches.push(m); } }
      }
      ALLE = matches;
      // Ticker: het toernooi dat NU live is = een toernooi met een lopende (playing)
      // wedstrijd. Zo valt een parallelle league weg die vandaag wél op de cameratafels
      // heeft gespeeld maar nu niets lopends heeft (bv. 14.1 Summer League: 0 playing).
      // Voorkeur voor lopende partijen op onze cameratafels; anders elk lopend toernooi;
      // als laatste (niets live) de laatst gespeelde op de cameratafels.
      const cameraSet = new Set(CAMERAS);
      const naam = (m) => (m._toernooi || '').trim();
      const opCamera = (m) => heeftTafel(m) && cameraSet.has(num(m.table && m.table.name));
      let namen = matches.filter((m) => opCamera(m) && st(m) === 'playing').map(naam).filter(Boolean);
      if (!namen.length) namen = matches.filter((m) => st(m) === 'playing').map(naam).filter(Boolean);
      if (!namen.length) namen = matches.filter((m) => opCamera(m) && st(m) === 'finished').map(naam).filter(Boolean);
      TOERNOOINAMEN = [...new Set(namen)];
      // Alle toernooien van vandaag (met wedstrijden op tafels) — voor de dropdown.
      TOERNOOIEN_VANDAAG = [...new Set(matches.filter(heeftTafel).map(naam).filter(Boolean))].sort();
      bouwKleuren(TOERNOOIEN_VANDAAG);
      GELADEN = true;
      document.getElementById('ts').textContent = new Date().toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
      renderToernooiOpties();
      render();
      renderTicker();
    } catch (e) {
      if (!GELADEN) toon(`<div class="melding">Kon de standen even niet laden.<br>De pagina probeert het zo opnieuw.</div>`);
    }
  }

  const st = (m) => String(m.matchstatus || '').toLowerCase();
  const heeftTafel = (m) => m.table && m.table.name != null && String(m.table.name).trim() !== '';
  // Rode gloed = deze tafel is NU live op ónze YouTube (heeft een 📺), niet zomaar
  // elke lopende Cuescore-wedstrijd.
  const opYoutube = (m) => !!STREAMS[String(m.table && m.table.name)];
  const tijd = (iso) => { const t = Date.parse(iso || ''); return Number.isNaN(t) ? 0 : t; };
  const opTafel = (a, b) => num(a.table && a.table.name) - num(b.table && b.table.name);

  // Hoeveel filters staan aan (voor het telpilletje op de filterknop).
  function actieveFilters() {
    return (FILTERS.afgelopen ? 1 : 0) + (FILTERS.youtube ? 1 : 0) + (FILTERS.gepind ? 1 : 0);
  }

  // Bouwt de weergave uit ALLE, met zoekterm (#29) + filters (#…) toegepast.
  function render() {
    if (!GELADEN) return;
    const q = (document.getElementById('zoek').value || '').trim().toLowerCase();
    const zoekt = (m) => {
      if (!q) return true;
      const a = ((m.playerA && m.playerA.name) || '').toLowerCase();
      const b = ((m.playerB && m.playerB.name) || '').toLowerCase();
      const tf = String((m.table && m.table.name) || '').toLowerCase();
      return a.includes(q) || b.includes(q) || tf === q || ('tafel ' + tf).includes(q);
    };
    const filtert = (m) => {
      if (FILTERS.afgelopen && st(m) === 'finished') return false;
      if (FILTERS.youtube && !STREAMS[String((m.table && m.table.name) || '')]) return false;
      if (FILTERS.gepind && !isPin(num(m.table && m.table.name))) return false;
      return true;
    };
    // Toernooi-keuze uit de dropdown (of automatisch het gestreamde toernooi).
    const actief = toonToernooiSet(); // null = alle toernooien
    const inToernooi = (m) => !actief || actief.has((m._toernooi || '').trim());
    const basis = ALLE.filter((m) => heeftTafel(m) && inToernooi(m) && zoekt(m) && filtert(m));

    // Per toernooi een kaart; binnen de kaart eerst wat nu bezig is, dan wat straks komt, dan
    // de laatst afgelopen partijen. Toernooien met lopende wedstrijden staan bovenaan.
    const groepen = [];
    for (const naamT of TOERNOOIEN_VANDAAG) {
      const mt = basis.filter((m) => (m._toernooi || '').trim() === naamT);
      const live = mt.filter((m) => st(m) === 'playing').sort(opTafel);
      const straks = mt.filter((m) => st(m) === 'waiting').sort(opTafel).slice(0, 12);
      const afgelopen = mt.filter((m) => st(m) === 'finished').sort((a, b) => tijd(b.stoptime) - tijd(a.stoptime)).slice(0, 8);
      if (live.length + straks.length + afgelopen.length) groepen.push({ naamT, live, straks, afgelopen });
    }
    groepen.sort((a, b) => (b.live.length > 0) - (a.live.length > 0) || a.naamT.localeCompare(b.naamT));
    return groepen.length ? toon(groepen.map(kaart).join('')) : toonLeeg(q);
  }

  function kaart(g) {
    const tellers = [g.live.length ? `${g.live.length} live` : '', g.straks.length ? `${g.straks.length} straks` : ''].filter(Boolean).join(' · ');
    return `<section class="tcard" style="--tk:${kleurVan(g.naamT) || '#888'}">
      <h3><span class="tn">${esc(g.naamT)}</span><span class="tt">${tellers}</span></h3>
      ${[...g.live, ...g.straks, ...g.afgelopen].map(mrij).join('')}
    </section>`;
  }

  function toonLeeg(q) {
    if (FILTERS.gepind && PINS.size === 0) {
      return toon(`<div class="melding">Je hebt nog geen tafels vastgepind.<br>Tik op 📌 bij een wedstrijd om je eigen weergave te maken.</div>`);
    }
    const ietsActief = q || actieveFilters() || toonToernooiSet();
    return toon(`<div class="melding">${ietsActief
      ? 'Geen wedstrijden die aan je zoekopdracht/filters voldoen.'
      : 'Nog geen wedstrijden.<br>Zodra er gespeeld wordt, verschijnen de standen hier vanzelf.'}</div>`);
  }

  // Eén compacte regel (S/XL-weergave): [tafel] speler A  score  speler B  [📺]
  function mrij(m) {
    const a = (m.playerA && m.playerA.name) || 'nog onbekend';
    const b = (m.playerB && m.playerB.name) || 'nog onbekend';
    const sa = m.scoreA != null ? m.scoreA : 0;
    const sb = m.scoreB != null ? m.scoreB : 0;
    const tnr = (m.table && m.table.name) ? String(m.table.name) : '?';
    const vid = STREAMS[String(m.table && m.table.name)];
    const kijk = vid
      ? `<a class="mk" title="Kijk deze tafel live" href="https://www.youtube.com/watch?v=${esc(vid)}" target="_blank" rel="noreferrer">📺</a>`
      : '';
    // Statusstip: rood = nu bezig, grijs = staat klaar (nog niet begonnen). Afgelopen
    // wedstrijden dimmen. Gloed (rode rand) alleen als wij die tafel live streamen (📺).
    const status = st(m);
    const dot = status === 'playing' ? '<span class="sdot spelen" title="Nu bezig"></span>'
      : status === 'waiting' ? '<span class="sdot straks" title="Staat klaar — nog niet begonnen"></span>'
      : '';
    const soort = [
      vid ? 'live' : '',
      status === 'finished' ? 'klaar' : '',
      status === 'waiting' ? 'wacht' : '',
    ].filter(Boolean).join(' ');
    const kl = kleurVan(m._toernooi);
    return `<div class="mrij ${soort}" ${kl ? `style="--tk:${kl}" ` : ''}title="${esc(m._toernooi || '')}">
      <span class="helft links">${pinKnop(tnr)}<span class="mt">${esc(tnr)}</span>${dot}<span class="ma">${esc(a)}</span></span>
      <span class="ms"><span class="sa">${esc(sa)}</span><span class="sep">-</span><span class="sb">${esc(sb)}</span></span>
      <span class="helft rechts"><span class="mb">${esc(b)}</span>${kijk}</span>
    </div>`;
  }

  // De pin-knop voor een tafel. data-tafel wordt door de klik-afhandelaar gebruikt.
  const PIN_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><line x1="12" x2="12" y1="17" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>';
  function pinKnop(tnr) {
    const aan = isPin(tnr);
    return `<button type="button" class="pin ${aan ? 'aan' : ''}" data-tafel="${esc(tnr)}" title="${aan ? 'Losmaken' : 'Vastpinnen'}" aria-label="${aan ? 'Tafel losmaken' : 'Tafel vastpinnen'}" aria-pressed="${aan}">${PIN_SVG}</button>`;
  }

  function toon(html) { document.getElementById('inhoud').innerHTML = html; }

  // Toernooi-ticker: laat de toernooinaam/-namen van vandaag langzaam voorbij scrollen.
  // Bouwt alleen opnieuw als de tekst wijzigt (anders zou de animatie steeds herstarten).
  function renderTicker() {
    const el = document.getElementById('ticker');
    if (!el) return;
    const set = toonToernooiSet();
    const namen = set ? [...set] : TOERNOOIEN_VANDAAG; // volgt de dropdown-keuze
    const tekst = namen.join(' • '); // ruime bullet-scheiding
    const sleutel = tekst + '|' + namen.map(kleurVan).join(',');
    if (sleutel === TICKER_GETOOND) return;
    TICKER_GETOOND = sleutel;
    if (!tekst) { el.hidden = true; el.innerHTML = ''; return; }
    // Snelheid schaalt met de lengte → overal ongeveer even "langzaam".
    const dur = Math.min(90, Math.max(18, tekst.length * 0.4));
    const span = `<span>${namen.map((n) => `<i class="tkdot" style="--tk:${kleurVan(n)}"></i>${esc(n)}`).join('&nbsp;&nbsp;&nbsp;')}</span>`;
    // Twee identieke kopieën + translateX(-50%) = naadloze lus.
    el.innerHTML = `<div class="tickertrack" style="animation-duration:${dur}s">${span}${span}</div>`;
    el.hidden = false;
  }

  // Livestream-paneel: tabs voor de cameratafels + de YouTube-embed van de gekozen tafel.
  // De iframe wordt alleen herbouwd als het videoId wijzigt, zodat de 20s-verversing de
  // lopende stream niet telkens herlaadt.
  function renderStream() {
    const paneel = document.getElementById('streampaneel');
    if (!paneel) return;
    // Eenmalig automatisch de eerste tafel kiezen die echt live is.
    if (!streamAutoGekozen && Object.keys(STREAMS).length) {
      const eersteLive = CAMERAS.find((nr) => STREAMS[String(nr)]);
      if (eersteLive) STREAM_SEL = eersteLive;
      streamAutoGekozen = true;
    }
    const PASTEL = { 1: '#b8d4ff', 3: '#c3efc3', 15: '#ffe2a8', 16: '#e5ccff' };
    document.getElementById('streamtabs').innerHTML = CAMERAS.map((nr) => {
      const heeft = !!STREAMS[String(nr)];
      const aan = nr === STREAM_SEL;
      return `<button type="button" class="tab ${aan ? 'aan' : ''} ${heeft ? 'live' : ''}" style="--pc:${PASTEL[nr] || '#ddd'}" data-nr="${nr}">${heeft ? '<span class="tabdot"></span>' : ''}Tafel ${nr}</button>`;
    }).join('');
    const vid = STREAMS[String(STREAM_SEL)] || null;
    if (vid !== STREAM_VID_GETOOND) {
      STREAM_VID_GETOOND = vid;
      document.getElementById('streamvideo').innerHTML = vid
        ? `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(vid)}?autoplay=1&mute=1&vq=hd1080" title="Tafel ${STREAM_SEL} livestream" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`
        : `<div class="geenstream">Geen livestream voor Tafel ${STREAM_SEL}.</div>`;
    }
    paneel.hidden = false;
  }

  // Zet de knoppen/velden in lijn met de huidige staat (bij laden + na reset/wissel).
  // Vult de toernooi-dropdown (opties = "Allemaal" + alle toernooien vandaag) en zet de
  // nu-getoonde keuze als geselecteerd (bij automatisch: het gestreamde toernooi).
  function renderToernooiOpties() {
    const el = document.getElementById('chips');
    if (!el) return;
    el.hidden = TOERNOOIEN_VANDAAG.length < 2; // bij één toernooi valt er niets te kiezen
    const gekozen = toonToernooiSet();
    const huidige = gekozen ? [...gekozen][0] : null;
    el.innerHTML = `<button type="button" class="chip ${huidige ? '' : 'aan'}" data-toernooi="ALLE">Alles</button>`
      + TOERNOOIEN_VANDAAG.map((n) => `<button type="button" class="chip ${n === huidige ? 'aan' : ''}" style="--tk:${kleurVan(n)}" data-toernooi="${esc(n)}"><i></i>${esc(n)}</button>`).join('');
  }

  function pasControlsToe() {
    document.getElementById('wMinimal').classList.toggle('aan', WEERGAVE === 'minimal');
    document.getElementById('wXL').classList.toggle('aan', WEERGAVE === 'xl');
    document.body.classList.toggle('xl', WEERGAVE === 'xl');
    renderToernooiOpties();
    for (const [id, sleutel] of [['tGepind', 'gepind'], ['tAfgelopen', 'afgelopen'], ['tYoutube', 'youtube']]) {
      document.getElementById(id).setAttribute('aria-pressed', FILTERS[sleutel] ? 'true' : 'false');
    }
  }

  function setWeergave(w) { WEERGAVE = w; bewaar(); pasControlsToe(); render(); }

  // Events koppelen.
  document.getElementById('zoek').addEventListener('input', render);
  document.getElementById('wMinimal').addEventListener('click', () => setWeergave('minimal'));
  document.getElementById('wXL').addEventListener('click', () => setWeergave('xl'));

  document.getElementById('chips').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-toernooi]');
    if (!b) return;
    TOERNOOIKEUZE = b.dataset.toernooi;
    bewaar(); pasControlsToe(); render(); renderTicker();
  });
  for (const [id, sleutel] of [['tGepind', 'gepind'], ['tAfgelopen', 'afgelopen'], ['tYoutube', 'youtube']]) {
    document.getElementById(id).addEventListener('click', () => { FILTERS[sleutel] = !FILTERS[sleutel]; bewaar(); pasControlsToe(); render(); });
  }

  // Pin-knoppen (📌) in de standen: klik = tafel vastpinnen/losmaken.
  document.getElementById('inhoud').addEventListener('click', (e) => {
    const b = e.target.closest('button.pin');
    if (!b) return;
    togglePin(b.dataset.tafel);
  });

  // Livestream-tabs: klik = andere tafel tonen.
  document.getElementById('streamtabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-nr]');
    if (!b) return;
    STREAM_SEL = Number(b.dataset.nr);
    renderStream();
  });

  // Ververs-timer + zichtbaarheid (#107-vervolg): een browsertab op de achtergrond
  // (andere tab, geminimaliseerd, scherm uit) throttelt setInterval fors — soms tot
  // eens per minuut, soms helemaal niet meer. Wie de pagina laat openstaan terwijl hij
  // iets anders doet en er later weer op kijkt, ziet dan verouderde standen totdat de
  // volgende (vertraagde) ronde toevallig langskomt. Vandaar: de timer loopt alleen
  // terwijl het tabblad zichtbaar is, en een tabblad dat weer zichtbaar wordt, ververst
  // ONMIDDELLIJK — precies het moment waarop iemand terugkijkt.
  let verversTimer = null;
  function stopVerversen() {
    if (verversTimer) { clearInterval(verversTimer); verversTimer = null; }
  }
  function startVerversen() {
    stopVerversen();
    verversTimer = setInterval(laad, REFRESH_MS);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { laad(); startVerversen(); }
    else stopVerversen();
  });

  pasControlsToe();
  renderStream();
  laad();
  startVerversen();
</script>
<script src="/site-nav.js" defer></script>
</body>
</html>
