<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Live in de zaal</title>
<!-- Fullbleed pauze-kaart; lang genoeg om meerdere tafels te laten rouleren. -->
<meta name="pauze-seconden" content="40">
<meta name="pauze-fullbleed" content="1">
<style>
  /* Eigen Mokum-jumbotron (#54) — ontwerp van Peter (Claude design): één tafelkaart
     tegelijk, schuift van rechts naar het midden, over de zaalfoto. Huisstijl zwart/rood
     + Arial Black. Data uit onze eigen /api/live (venueTables). */
  html, body {
    margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden;
    background: #000; color: #fff; font-family: 'Arial Black', Arial, sans-serif;
  }
  .bg {
    position: absolute; inset: 0; z-index: 0;
    background-image:
      linear-gradient(180deg, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.45) 40%, rgba(0,0,0,0.72) 100%),
      url('../img/jumbotron-bg.jpg'),
      linear-gradient(160deg, #12161d, #0a0d11);
    /* De foto is bij de bron symmetrisch bijgesneden (links 164px eraf) zodat MOKUM
       gecentreerd staat en de tafels gelijk zijn. 100% 100% toont de hele foto. */
    background-size: 100% 100%, 100% 100%, cover;
    background-position: center;
  }

  .stage { position: absolute; inset: 0; z-index: 1; overflow: hidden; }

  /* Kaart gecentreerd via marges (zodat de transform vrij is voor de slide-animatie). */
  .card {
    /* Verticaal in de bar-zone (tussen het MOKUM-bord en de tafels), niet dood-gecentreerd. */
    position: absolute; left: 50%; top: 44%;
    width: 1040px; height: 520px; margin-left: -520px; margin-top: -260px;
    box-sizing: border-box; padding: 40px 52px 44px;
    background: rgba(8,8,8,0.78); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; gap: 26px;
  }
  .card.in  { animation: cardIn  0.75s cubic-bezier(0.22, 0.9, 0.3, 1) forwards; }
  /* De oude kaart faded snel weg (i.p.v. 0,9s naar links te schuiven), zodat er nooit
     twee kaarten tegelijk in het midden staan → vloeiende wissel. */
  .card.out { animation: cardOut 0.3s ease forwards; }
  @keyframes cardIn  { from { transform: translateX(1300px); } to { transform: translateX(0); } }
  @keyframes cardOut { from { opacity: 1; } to { opacity: 0; transform: translateX(-40px); } }

  /* Ticker (#65): vrije berichtenbalk in de middengang tussen de twee tafels, ónder de
     kaart — mag de tafels op de achtergrondfoto niet overlappen. Geen label, alleen
     scrollende tekst. Maten staan als variabelen zodat ze in OBS bij te stellen zijn
     (ook live via ?tickerTop= / ?tickerBreedte= / ?tickerHoogte= / ?tickerSnelheid=). */
  :root {
    /* Verankerd aan de ONDERKANT: de balk hoort altijd onderin beeld te plakken,
       ongeacht de hoogte van het venster. Breedte in procenten zodat 'ie meeschaalt;
       op 1920 breed is 54% ruim 1030px — precies de vrije gang tussen de tafelhoeken. */
    --ticker-onder: 1%;
    --ticker-breedte: 54%;
    --ticker-hoogte: 72px;
  }
  .ticker {
    position: absolute; z-index: 2;
    left: 50%; bottom: var(--ticker-onder);
    width: var(--ticker-breedte); margin-left: calc(var(--ticker-breedte) / -2);
    height: var(--ticker-hoogte);
    overflow: hidden;
    display: flex; align-items: center;
    background: rgba(8,8,8,0.22);
    /* Rand zwart i.p.v. wit: een lichte lijn bovenlangs verraadt de balk als 'plaatje op
       de foto'. Zwart valt weg in de donkere vloer. */
    border: 1px solid rgba(0,0,0,0.55);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.30);
    /* Randen zacht laten uitvloeien, zodat tekst niet hard afgekapt in/uit beeld schuift. */
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 48px, #000 calc(100% - 48px), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 48px, #000 calc(100% - 48px), transparent 100%);
  }
  .ticker[hidden] { display: none; }
  .ticker .spoor {
    display: inline-flex; flex: none; white-space: nowrap; will-change: transform;
    animation: tickerLoop linear infinite;
  }
  /* Het spoor bevat de reeks twee keer; we schuiven precies één reeks op → naadloze lus. */
  @keyframes tickerLoop {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(var(--afstand, 0) * -1px)); }
  }
  .ticker .item {
    font-family: Arial, sans-serif; font-weight: bold;
    font-size: 24px; letter-spacing: 0.4px;
    color: rgba(255,255,255,0.92);
    padding: 0 34px;
    display: inline-flex; align-items: center; gap: 34px;
  }
  .ticker .item::after {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: #cc0000; flex: none;
  }

  /* Highlight-scherm (#71): tussen de wedstrijden door speelt hier een run-out-clip, in
     dezelfde kaartstijl als de scorekaart. Eigen overlay-laag (net als het podium), NIET
     in het rouleer-systeem — anders zou de YouTube-speler elke tik herladen.
     Maten in procenten/vh, zodat een preview in een willekeurig venster klopt met OBS. */
  .highlight { position: absolute; inset: 0; z-index: 1; }
  .highlight[hidden] { display: none; }
  .highlight .hcard {
    position: absolute; left: 50%; top: 15.4%; bottom: 13.3%;
    width: 64.6%; margin-left: -32.3%;
    box-sizing: border-box; padding: 2vh 2vh 1.6vh;
    background: rgba(8,8,8,0.78); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 2vh; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; gap: 1.4vh; overflow: hidden;
  }
  .highlight .hdoek {
    position: relative; flex: 1; min-height: 0;
    border-radius: 1.3vh; overflow: hidden; background: #000;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .highlight .hdoek iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* Vangt klikken/hover af én dekt de titelbalk die YouTube bovenin toont. */
  .highlight .hafdek { position: absolute; inset: 0; z-index: 2; }
  .highlight .hafdek::before {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 9vh;
    background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%);
  }
  .highlight .hvoet { flex: none; display: flex; align-items: baseline; gap: 1.6vh; padding: 0 1vh; }
  .highlight .hvoetNaam { font-size: 3vh; }
  .highlight .hvoetDatum { margin-left: auto; font-family: Arial, sans-serif; font-size: 2vh; color: rgba(255,255,255,0.55); }
  .highlight .hmelding {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: Arial, sans-serif; font-size: 2.6vh; color: rgba(255,255,255,0.7);
  }
  .highlight .hmelding[hidden] { display: none; }

  /* QR naar het archief, linksboven. */
  .highlight .qr { position: absolute; left: 2.5%; top: 2.5%; display: flex; align-items: center; gap: 1.3vh; }
  .highlight .qr img { width: 8vh; height: 8vh; display: block; background: #fff; padding: 0.5vh; border-radius: 0.7vh; }
  .highlight .qr .label { font-family: 'Arial Black', Arial, sans-serif; font-size: 3vh; line-height: 1.15; }
  .highlight .qr .label .m { color: #cc0000; }
  .highlight .qr .label .sub { display: block; font-family: Arial, sans-serif; font-size: 1.7vh; color: rgba(255,255,255,0.5); margin-top: 0.3vh; }

  /* Neon-kop "HIGHLIGHTS", rechtsboven — 20% kleiner zodat 'ie het MOKUM-bord niet raakt. */
  .highlight .neon {
    position: absolute; right: 2.5%; top: 3.2%;
    font-size: 4.8vh; letter-spacing: 0.72vh; color: #fff;
    text-shadow: 0 0 0.6vh #fff, 0 0 1.4vh #ff4d4d, 0 0 2.8vh #cc0000, 0 0 5.6vh #cc0000, 0 0 9vh rgba(204,0,0,0.7);
    animation: flikker 7s linear infinite;
  }
  @keyframes flikker {
    0%, 88%, 100% { opacity: 1; } 89% { opacity: 0.45; } 90% { opacity: 1; }
    91% { opacity: 0.65; } 92% { opacity: 1; } 96% { opacity: 0.8; } 97% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .neon { animation: none; } }

  .kop { display: flex; align-items: center; gap: 22px; }
  .tafel { font-size: 58px; line-height: 1; }
  .ronde { font-family: Arial, sans-serif; font-size: 26px; color: rgba(255,255,255,0.6); }
  .badge {
    margin-left: auto; display: flex; align-items: center; gap: 12px;
    background: #cc0000; color: #fff; padding: 10px 22px; border-radius: 999px; font-size: 26px;
  }
  .badge .stip { width: 14px; height: 14px; border-radius: 50%; background: #fff; animation: livePulse 1.4s ease-in-out infinite; }
  @keyframes livePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .spelers { display: flex; flex-direction: column; gap: 16px; flex: 1; justify-content: center; }
  .speler {
    display: flex; align-items: center; gap: 26px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px; padding: 18px 26px;
  }
  .avatar {
    width: 86px; height: 86px; border-radius: 50%; flex-shrink: 0; object-fit: cover;
    background: #3a4a5a; border: 3px solid rgba(255,255,255,0.25);
  }
  .vlag {
    width: 52px; height: 36px; flex-shrink: 0; object-fit: cover; border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .naam { flex: 1; font-size: 40px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score {
    width: 110px; height: 86px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: #cc0000; color: #fff; font-size: 52px; border-radius: 12px;
    box-shadow: 0 6px 20px rgba(204,0,0,0.4); font-variant-numeric: tabular-nums;
  }

  /* --- Promo-poster (#54): om de 120s even tonen met een gordijn-overgang --- */
  .poster {
    position: absolute; inset: 0; z-index: 3; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  .poster[hidden] { display: none; }
  .poster img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

  /* Theatergordijn: twee rood-fluwelen panelen die dichtschuiven en weer open. */
  .curtain { position: absolute; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .curtain .panel {
    position: absolute; top: 0; bottom: 0; width: 51%;
    /* Fluweel: verticale plooien (lichte/donkere rode banden) + randschaduw. */
    background:
      linear-gradient(90deg, rgba(0,0,0,0.55), rgba(0,0,0,0) 10%, rgba(0,0,0,0) 90%, rgba(0,0,0,0.55)),
      repeating-linear-gradient(90deg, #6c0d0d 0, #a11616 26px, #560808 52px, #6c0d0d 78px);
    box-shadow: inset 0 0 120px rgba(0,0,0,0.6);
    transition: transform 1s cubic-bezier(0.7, 0, 0.3, 1);
  }
  .curtain .left  { left: 0;  transform: translateX(-100%); }   /* open = uit beeld links */
  .curtain .right { right: 0; transform: translateX(100%); }    /* open = uit beeld rechts */
  .curtain.dicht .left  { transform: translateX(0); }
  .curtain.dicht .right { transform: translateX(0); }

  /* ============ Podium-eindscherm (winnaar-moment #54) ============ */
  .podium {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    /* Onderaan uitlijnen zodat de "MOKUM"-tekst bovenin de achtergrond vrij leesbaar blijft. */
    gap: 26px; padding: 40px 40px 70px;
  }
  .podium[hidden] { display: none; }
  .podiumTitel { text-align: center; text-shadow: 0 4px 24px rgba(0,0,0,0.85); }
  .podiumTitel .groot { font-size: 78px; line-height: 1; letter-spacing: 1px; }
  .podiumTitel .sub {
    display: block; margin-top: 14px; font-family: Arial, sans-serif; font-weight: bold;
    font-size: 30px; color: #f4c430; text-transform: uppercase; letter-spacing: 4px;
  }

  .podiumRij { display: flex; align-items: flex-end; justify-content: center; gap: 46px; }
  .plek { display: flex; flex-direction: column; align-items: center; width: 300px; position: relative; }
  .kroon { font-size: 66px; line-height: 1; margin-bottom: 6px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6)); animation: zweef 2.6s ease-in-out infinite; }
  @keyframes zweef { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-12px) rotate(4deg); } }

  .pfoto {
    width: 160px; height: 160px; border-radius: 50%; object-fit: cover;
    border: 6px solid var(--rand, #888); background: #2a3542;
    box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  }
  .plek.winner .pfoto {
    width: 200px; height: 200px;
    box-shadow: 0 0 70px rgba(244,196,48,0.75), 0 12px 40px rgba(0,0,0,0.6);
    animation: gloed 2.2s ease-in-out infinite;
  }
  @keyframes gloed {
    0%,100% { box-shadow: 0 0 60px rgba(244,196,48,0.6), 0 12px 40px rgba(0,0,0,0.6); }
    50% { box-shadow: 0 0 100px rgba(244,196,48,0.95), 0 12px 40px rgba(0,0,0,0.6); }
  }
  .pnaam {
    margin-top: 18px; font-size: 34px; max-width: 290px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .plek.winner .pnaam { font-size: 40px; color: #f7d55a; }
  .pvlag {
    width: 46px; height: 31px; margin-top: 10px; object-fit: cover; border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.35); box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .podest {
    margin-top: 22px; width: 100%;
    background: linear-gradient(180deg, #1a2740, #0c1322);
    border: 1px solid rgba(255,255,255,0.1); border-top: 5px solid var(--rand, #888);
    border-radius: 10px 10px 0 0; box-shadow: inset 0 8px 30px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
  }
  .pnum { font-size: 120px; line-height: 1; color: var(--rand, #888); text-shadow: 0 4px 20px rgba(0,0,0,0.6); }

  /* Laserstralen: dunne gekleurde balken die vanuit de twee bovenhoeken de zaal in
     sweepen (screen-blend). Links-boven waaiert naar rechtsonder, rechts-boven naar
     linksonder. */
  .lasers { position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
  .lasers[hidden] { display: none; }
  .lasers .beam {
    position: absolute; top: 0; width: 2100px; height: 5px;
    mix-blend-mode: screen; opacity: 0.55; border-radius: 3px;
    filter: blur(0.5px) drop-shadow(0 0 8px var(--laser, #cc0000));
    animation: sweep var(--dur, 7s) ease-in-out infinite alternate;
  }
  .lasers .beam.links {
    left: 0; transform-origin: left center;
    background: linear-gradient(90deg, var(--laser, #cc0000) 0%, rgba(0,0,0,0) 78%);
  }
  .lasers .beam.rechts {
    right: 0; transform-origin: right center;
    background: linear-gradient(270deg, var(--laser, #cc0000) 0%, rgba(0,0,0,0) 78%);
  }
  @keyframes sweep { from { transform: rotate(var(--van, 15deg)); } to { transform: rotate(var(--tot, 60deg)); } }

  .confetti { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .confetti[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .card.in, .card.out, .curtain .panel { animation: none; transition: none; }
    .kroon, .plek.winner .pfoto, .lasers .beam { animation: none; }
  }

  /* Info-sheets (#72): 'Toernooiwinnaars' + 'Komende toernooien'. Eigen overlay-laag, in de
     rotatie na de scores-fase. Zelfde kaartstijl/plek als de highlight-kaart; maten in vh
     zodat een preview in een willekeurig venster klopt met OBS (1vh = 10,8px op 1080). */
  .blad { position: absolute; inset: 0; z-index: 1; }
  .blad[hidden] { display: none; }
  .blad .bkaart {
    position: absolute; left: 50%; top: 44%;
    width: 61.5%; height: 57.4vh; margin-left: -30.75%; margin-top: -28.7vh;
    box-sizing: border-box; padding: 3.5vh 4.4vh 2.8vh;
    background: rgba(8,8,8,0.80); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 1.8vh; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    display: flex; flex-direction: column;
  }
  .blad .blogo { position: absolute; top: 2.2vh; right: 2.6vh; height: 9.3vh; width: auto;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.55)); }
  .blad .bkop { display: flex; align-items: baseline; gap: 1.5vh; margin-bottom: 1.8vh; }
  .blad .bkop h1 { margin: 0; font-size: 4.3vh; letter-spacing: 1px; text-transform: uppercase; color: #dd2222; }
  .blad .bkop .bsub { font-family: Arial, sans-serif; font-weight: bold; color: #9aa0a6; font-size: 1.85vh; }
  .blad .blijst { display: flex; flex-direction: column; }
  .blad .brij { display: flex; align-items: center; gap: 2vh; padding: 1.35vh 0.6vh;
    border-bottom: 1px solid rgba(255,255,255,0.08); }
  .blad .brij:last-child { border-bottom: 0; }
  .blad .bbadge { width: 5vh; height: 5vh; flex: none; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 2.4vh; background: #1c1c1c;
    border: 1px solid rgba(255,255,255,0.10); }
  .blad .bbadge.goud { background: radial-gradient(circle at 35% 30%, #ffe08a, #d4a017); }
  .blad .bdate { width: 6.9vh; height: 5.4vh; flex: none; border-radius: 1.1vh; background: #141821;
    border: 1px solid rgba(255,255,255,0.10); display: flex; flex-direction: column;
    align-items: center; justify-content: center; line-height: 1; }
  .blad .bdate .d { font-size: 2.4vh; }
  .blad .bdate .m { font-family: Arial, sans-serif; font-weight: bold; font-size: 1.4vh;
    color: #cc4444; text-transform: uppercase; margin-top: 0.3vh; }
  .blad .bhoofd { flex: 1; min-width: 0; }
  .blad .bhoofd .bnaam { font-size: 2.8vh; line-height: 1.1; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .blad .bonder { font-family: Arial, sans-serif; font-weight: bold; color: #9aa0a6; font-size: 1.75vh;
    margin-top: 0.5vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .blad .bmeta { flex: none; text-align: right; font-family: Arial, sans-serif; }
  .blad .bmeta .top { font-weight: bold; font-size: 1.9vh; color: #e8e8e8; }
  .blad .bmeta .bot { font-weight: bold; font-size: 1.6vh; color: #8a9096; margin-top: 0.4vh; }
  .blad .bdisc { display: inline-block; background: #20242c; color: #cfd3d8; font-family: Arial, sans-serif;
    font-weight: bold; font-size: 1.4vh; padding: 0.3vh 0.9vh; border-radius: 0.6vh; margin-left: 1vh;
    vertical-align: middle; }
  .blad .bvoet { margin-top: auto; padding-top: 1.5vh; text-align: center; font-family: Arial, sans-serif;
    font-weight: bold; color: #7a8086; font-size: 1.6vh; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="stage" id="stage"></div>

  <!-- Highlight-scherm (#71): run-out-clip tussen de wedstrijden door. -->
  <div class="highlight" id="highlight" hidden>
    <div class="qr">
      <img src="../img/qr-archief.svg" alt="QR naar mokum-streams.pdscloud.nl/archief">
      <span class="label"><span class="m">Mokum</span> Archief<span class="sub">scan en kijk terug</span></span>
    </div>
    <div class="neon">HIGHLIGHTS</div>
    <div class="hcard">
      <div class="hdoek">
        <div id="hplayer"></div>
        <div class="hafdek"></div>
        <div class="hmelding" id="hmelding">Highlights laden…</div>
      </div>
      <div class="hvoet">
        <span class="hvoetNaam" id="hNaam">—</span>
        <span class="hvoetDatum" id="hDatum"></span>
      </div>
    </div>
  </div>

  <!-- Info-sheets (#72): winnaars + komende toernooien, in de rotatie na de scores-fase. -->
  <div class="blad" id="bWinnaars" hidden>
    <div class="bkaart">
      <img class="blogo" src="../../mokum-logo.png" alt="">
      <div class="bkop"><h1>Toernooiwinnaars</h1><span class="bsub">recente kampioenen bij Mokum</span></div>
      <div class="blijst" id="bWinnaarsLijst"></div>
      <div class="bvoet">Volgende kampioen? Schrijf je in via cuescore.com/mokumpooldarts</div>
    </div>
  </div>
  <div class="blad" id="bKomende" hidden>
    <div class="bkaart">
      <img class="blogo" src="../../mokum-logo.png" alt="">
      <div class="bkop"><h1>Komende toernooien</h1><span class="bsub">bij Mokum Pool &amp; Darts</span></div>
      <div class="blijst" id="bKomendeLijst"></div>
      <div class="bvoet">Doe je mee? Inschrijven kan via cuescore.com/mokumpooldarts</div>
    </div>
  </div>

  <!-- Ticker (#65): scrollende berichtenbalk in de middengang, onder de kaart. -->
  <div class="ticker" id="ticker" hidden><div class="spoor" id="tickerSpoor"></div></div>

  <!-- Podium-eindscherm (winnaar-moment #54): laserstralen achter, podium in het midden, confetti ervoor. -->
  <div class="lasers" id="lasers" hidden>
    <!-- Linksboven → waaiert naar rechtsonder (positieve hoeken). -->
    <span class="beam links"  style="--laser:#cc0000; --van:12deg; --tot:40deg; --dur:6.5s"></span>
    <span class="beam links"  style="--laser:#f4c430; --van:26deg; --tot:56deg; --dur:8s"></span>
    <span class="beam links"  style="--laser:#19c3ff; --van:44deg; --tot:74deg; --dur:7.2s"></span>
    <!-- Rechtsboven → waaiert naar linksonder (negatieve hoeken). -->
    <span class="beam rechts" style="--laser:#ff2fd0; --van:-12deg; --tot:-40deg; --dur:9s"></span>
    <span class="beam rechts" style="--laser:#38ff8e; --van:-26deg; --tot:-56deg; --dur:7.8s"></span>
    <span class="beam rechts" style="--laser:#f4c430; --van:-44deg; --tot:-74deg; --dur:6.8s"></span>
  </div>
  <div class="podium" id="podium" hidden>
    <div class="podiumTitel"><span class="sub" id="podiumSub"></span></div>
    <div class="podiumRij" id="podiumRij"></div>
  </div>
  <canvas class="confetti" id="confetti" width="1920" height="1080" hidden></canvas>

  <div class="poster" id="poster" hidden><img src="../img/poster-10ball.png" alt="Mokum 10-ball Summer Break"></div>
  <div class="curtain" id="curtain"><div class="panel left"></div><div class="panel right"></div></div>

<script>
// Toont live wedstrijden uit onze eigen /api/live (venueTables), één tafelkaart tegelijk,
// die van rechts inschuift. Rouleert door alle live tafels (#54).
const APP_API = 'https://mokum-streams-func.azurewebsites.net';
const REFRESH_MS = 15000; // data verversen
const CARD_MS = 6000;     // hoe lang elke tafelkaart in beeld blijft

let liveTafels = [];
let idx = 0;
let huidigeKey = null; // welke tafel nu in beeld staat (om onnodig herbouwen te voorkomen)

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
));

function spelerHtml(p, score) {
  const avatar = p && p.image
    ? `<img class="avatar" src="${esc(p.image)}" alt="" onerror="this.removeAttribute('src')">`
    : '<span class="avatar"></span>';
  const vlag = p && p.flag ? `<img class="vlag" src="${esc(p.flag)}" alt="">` : '<span class="vlag" style="visibility:hidden"></span>';
  return `
    <div class="speler">
      ${avatar}${vlag}
      <span class="naam">${esc((p && p.name) || '—')}</span>
      <span class="score">${score == null ? '' : esc(score)}</span>
    </div>`;
}

function kaartHtml(t) {
  const ronde = t.round ? `<span class="ronde">${esc(t.round)}</span>` : '';
  return `
    <div class="kop">
      <span class="tafel">Tafel ${esc(t.table)}</span>${ronde}
      <span class="badge"><span class="stip"></span>LIVE</span>
    </div>
    <div class="spelers">
      ${spelerHtml(t.playerA, t.scoreA)}
      ${spelerHtml(t.playerB, t.scoreB)}
    </div>`;
}

function toon(t) {
  const stage = document.getElementById('stage');
  const nieuw = document.createElement('div');
  nieuw.className = 'card in';
  nieuw.innerHTML = kaartHtml(t);

  // Vorige kaart naar links uitschuiven en daarna opruimen.
  const oud = stage.querySelector('.card:not(.out)');
  if (oud) {
    oud.classList.remove('in');
    oud.classList.add('out');
    oud.addEventListener('animationend', () => oud.remove(), { once: true });
  }
  stage.appendChild(nieuw);
  huidigeKey = t.table;
}

let leegTeller = 0; // aantal opeenvolgende ophaal-rondes zonder live tafels (debounce)

async function ververs() {
  try {
    const r = await fetch(`${APP_API}/api/live`, { cache: 'no-store' });
    const d = await r.json();
    const alle = Array.isArray(d.venueTables) ? d.venueTables : [];
    const nieuw = alle.filter((t) => String(t.status || '').toLowerCase() === 'playing');
    if (nieuw.length) {
      leegTeller = 0;
      liveTafels = nieuw;
    } else {
      // Niet meteen "geen live" tonen bij een kort momentje zonder wedstrijd (bijv.
      // tussen twee racks); pas na 2 lege rondes de kaart loslaten.
      leegTeller += 1;
      if (leegTeller >= 2) liveTafels = [];
    }
    // Podium (winnaar-moment): in demo-modus altijd de demo, anders wat de backend geeft.
    updatePodium(DEMO ? demoPodium : (d.podium || null));
    tickerRegels = d.ticker;
  } catch (e) {
    /* netwerkfout → vorige beeld laten staan */
  }
  // Bewust BUITEN de try: een fout in de ticker mag niet verdwijnen in de netwerk-catch,
  // en de balk moet ook staan als /api/live even onbereikbaar is (dan met standaardtekst).
  zetTicker(tickerRegels);
}

const datumKort = (iso) => {
  const d = new Date(`${iso}T12:00:00Z`);
  return Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' });
};

// ============ Highlight-clips (#71) ============
// Tussen de wedstrijden door speelt een goedgekeurde run-out af (bron: /api/highlights).
// De speler leeft in een eigen overlay-laag (#highlight), NIET in het rouleer-systeem —
// een YouTube-speler die elke tik opnieuw wordt opgebouwd zou steeds herladen. We gebruiken
// de IFrame-API om het EINDE van een fragment op te vangen; laat je de speler zelf uitlopen,
// dan toont YouTube zijn eigen scherm met gerelateerde video's.
const HIGHLIGHTS_VERVERS_MS = 10 * 60 * 1000; // keuring verandert zelden
const CLIP_NOOD_MS = 20000;                   // vangnet als het eind-event uitblijft
let hlClips = [];
let hlIdx = -1;
let hlSpeler = null;
let hlKlaar = false;   // speler geïnitialiseerd?
let hlActief = false;  // speelt de highlight-laag nu?
let hlNoodTimer = null;
let hlClipStart = 0;   // performance.now() bij het laden van de huidige clip
let hlOverslaan = 0;   // opeenvolgende clips die verdacht snel 'eindigden' (spurious ENDED)
const CLIP_MIN_MS = 2000; // een echte run-out duurt langer; korter = spurious/kapot → overslaan

// Willekeurige volgorde (Fisher-Yates).
function schudClips(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Speler-gebalanceerde volgorde: niet steeds dezelfde clips én variatie in spelers.
// Een speler met veel run-outs zou anders het beeld domineren; daarom groeperen we per
// speler en verweven we met een 'smooth weighted round-robin'. Het gewicht is GEDEMPT
// (√aantal): wie 16 run-outs heeft komt ~4× zo vaak als een eenmalige speler, niet 16× —
// betere spelers iets vaker, maar niet te veel. Elke speler doorloopt intern z'n eigen
// clips (geschud), dus je ziet ook verschillende run-outs van dezelfde speler.
function interleaveOpSpeler(clips) {
  if (!Array.isArray(clips) || clips.length <= 2) return schudClips(clips || []);
  const perSpeler = new Map();
  for (const c of clips) {
    const k = c.speler || '?';
    if (!perSpeler.has(k)) perSpeler.set(k, []);
    perSpeler.get(k).push(c);
  }
  const groepen = [...perSpeler.values()].map((lijst) => {
    const g = schudClips(lijst);
    return { clips: g, wijzer: 0, gewicht: Math.sqrt(g.length), credit: 0 };
  });
  const totaalGewicht = groepen.reduce((s, g) => s + g.gewicht, 0);
  const uit = [];
  for (let i = 0; i < clips.length; i++) {
    for (const g of groepen) g.credit += g.gewicht;
    let beste = groepen[0];
    for (const g of groepen) if (g.credit > beste.credit) beste = g;
    beste.credit -= totaalGewicht;
    uit.push(beste.clips[beste.wijzer % beste.clips.length]);
    beste.wijzer += 1;
  }
  return uit;
}

async function haalHighlights() {
  try {
    const r = await fetch(`${APP_API}/api/highlights`, { cache: 'no-store' });
    const d = await r.json();
    hlClips = interleaveOpSpeler(d.items || []);
  } catch (e) { /* netwerkfout → vorige lijst laten staan */ }
}

function hlTekst(c) {
  document.getElementById('hNaam').textContent = `${c.speler} VS ${c.tegenstander || '?'}`;
  document.getElementById('hDatum').textContent = datumKort(c.datum);
}

// Speelt de VOLGENDE clip in de highlights-fase. Eén clip per fase: bij het einde schakelt
// hlClipKlaar() door naar de scores (clip-gedreven rotatie #71).
function hlVolgendeClip() {
  clearTimeout(hlNoodTimer);
  if (!hlKlaar || !hlClips.length) return;
  hlIdx = (hlIdx + 1) % hlClips.length;
  const c = hlClips[hlIdx];
  hlTekst(c);
  document.getElementById('hmelding').hidden = true;
  hlSpeler.loadVideoById({ videoId: c.videoId, startSeconds: c.clipVan, endSeconds: c.clipTot });
  hlClipStart = performance.now();
  // Vangnet: blijft het eind-event uit, dan tóch doorschakelen.
  hlNoodTimer = setTimeout(hlClipKlaar, (c.clipTot - c.clipVan) * 1000 + CLIP_NOOD_MS);
}

// Huidige clip klaar. Een clip die verdacht snel 'eindigt' (spurious ENDED vlak na het laden,
// of een kapotte clip) mag de highlight-fase niet meteen afkappen naar de scores: probeer dan
// eerst de volgende clip. Pas een clip die écht heeft gespeeld schakelt door naar de scores.
function hlClipKlaar() {
  clearTimeout(hlNoodTimer);
  if (fase !== 'highlights') return;
  if (performance.now() - hlClipStart < CLIP_MIN_MS) {
    hlOverslaan += 1;
    if (hlOverslaan <= hlClips.length) { hlVolgendeClip(); return; } // andere clip proberen
    hlOverslaan = 0; // alle clips bleken te kort → tóch door, anders blijven we hangen
  } else {
    hlOverslaan = 0;
  }
  naVolgendeFase();
}

// Highlight-laag aanzetten (het afspelen regelt betreedFase via hlVolgendeClip). Retour
// false als er niets te tonen is (geen goedgekeurde clips) → dan slaat het schema deze fase over.
function hlAan() {
  if (!hlClips.length) return false;
  if (hlActief) return true;
  hlActief = true;
  document.getElementById('highlight').hidden = false;
  document.getElementById('stage').innerHTML = ''; huidigeKey = null; // tafelkaarten weg
  return true;
}

function hlUit() {
  if (!hlActief) return;
  hlActief = false;
  clearTimeout(hlNoodTimer);
  document.getElementById('highlight').hidden = true;
  if (hlKlaar && hlSpeler.pauseVideo) hlSpeler.pauseVideo();
}

function hlStartSpeler() {
  hlSpeler = new YT.Player('hplayer', {
    width: '100%', height: '100%',
    playerVars: {
      autoplay: 1, mute: 1, controls: 0, disablekb: 1,
      modestbranding: 1, rel: 0, fs: 0, iv_load_policy: 3, playsinline: 1,
    },
    events: {
      onReady: () => { hlKlaar = true; if (hlActief) hlVolgendeClip(); },
      onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED && hlActief) hlClipKlaar(); },
      onError: () => { if (hlActief) hlVolgendeClip(); }, // kapotte clip → probeer de volgende
    },
  });
}

// ============ Info-sheets (#72): winnaars + komende toernooien ============
// Twee tekstsheets in de rotatie (na de scores-fase). Data uit /api/sheets: recente
// kampioenen (winnaar = wie de finale won) en de komende toernooien met aanvangstijd.
const SHEETS_VERVERS_MS = 30 * 60 * 1000; // elke 30 min (de backend cachet zelf ook)
let sheetWinnaars = [];
let sheetKomende = [];
const bladWEl = document.getElementById('bWinnaars');
const bladKEl = document.getElementById('bKomende');
function bladUit() { bladWEl.hidden = true; bladKEl.hidden = true; }

function winnaarRijHtml(w) {
  return `<div class="brij">
      <div class="bbadge goud">🏆</div>
      <div class="bhoofd"><div class="bnaam">${esc(w.winner)}</div><div class="bonder">${esc(w.toernooi)}</div></div>
      <div class="bmeta"><div class="top">${esc(w.discipline)}</div><div class="bot">${esc(w.datum)}</div></div>
    </div>`;
}
function komendeRijHtml(u) {
  const disc = u.discipline ? `<span class="bdisc">${esc(u.discipline)}</span>` : '';
  return `<div class="brij">
      <div class="bdate"><span class="d">${esc(u.dag)}</span><span class="m">${esc(u.mnd)}</span></div>
      <div class="bhoofd"><div class="bnaam">${esc(u.naam)}${disc}</div></div>
      <div class="bmeta"><div class="top">${esc(u.tijd)}</div><div class="bot">aanvang</div></div>
    </div>`;
}
function renderSheets() {
  document.getElementById('bWinnaarsLijst').innerHTML = sheetWinnaars.slice(0, 5).map(winnaarRijHtml).join('');
  document.getElementById('bKomendeLijst').innerHTML = sheetKomende.slice(0, 5).map(komendeRijHtml).join('');
}
async function haalSheets() {
  try {
    const r = await fetch(`${APP_API}/api/sheets`, { cache: 'no-store' });
    const d = await r.json();
    sheetWinnaars = Array.isArray(d.winners) ? d.winners : [];
    sheetKomende = Array.isArray(d.upcoming) ? d.upcoming : [];
    renderSheets();
  } catch (e) { /* netwerkfout → vorige lijst laten staan */ }
}

// ============ Pauze-schema (#71) — CLIP-GEDREVEN ============
// Tijdens een pauze rouleert de jumbotron clip-gedreven: één highlight (heel rack) → de live
// scores van de actieve tafels (~15s) → één info-sheet (roulerend: winnaars → komende →
// poster, 5s) → volgende highlight → ... De highlights-fase heeft géén vaste tijd: 'ie duurt
// tot de clip klaar is. Instelbaar in OBS met ?scoresSec= / ?sheetSec= / ?posterSec= .
const zoekSchema = new URLSearchParams(location.search);
const FASE_MS = {
  scores: (Number(zoekSchema.get('scoresSec')) || 15) * 1000,
  sheet:  (Number(zoekSchema.get('sheetSec')) || 5) * 1000,
  poster: (Number(zoekSchema.get('posterSec')) || 5) * 1000,
};
const FASE_VOLGORDE = { highlights: 'scores', scores: 'sheet', sheet: 'highlights' };
let fase = 'highlights';
let faseSinds = 0;          // ms-teller (via de scheduler-tik; geen Date.now → OBS-safe)
let sheetBeurt = 0;         // rouleert de info-sheets: winnaars → komende → poster
let podiumOnderbrak = false; // podium was actief → rotatie herstarten zodra het klaar is

// Beschikbare info-sheets in rouleer-volgorde (lege overslaan).
function sheetLijst() {
  const l = [];
  if (sheetWinnaars.length) l.push('winnaars');
  if (sheetKomende.length) l.push('komende');
  if (posterBeschikbaar) l.push('poster');
  return l;
}
function faseHeeftInhoud(f) {
  if (f === 'highlights') return hlClips.length > 0;
  if (f === 'scores') return liveTafels.length > 0;
  if (f === 'sheet') return sheetLijst().length > 0;
  return false;
}
// Toon één tekst-sheet (winnaars of komende); de poster wordt apart afgespeeld.
function toonSheet(kies) {
  bladWEl.hidden = kies !== 'winnaars';
  bladKEl.hidden = kies !== 'komende';
}
// Naar de volgende fase mét inhoud, en de bijbehorende actie uitvoeren.
function naVolgendeFase() {
  for (let i = 0; i < 3; i++) {
    fase = FASE_VOLGORDE[fase];
    faseSinds = 0;
    if (faseHeeftInhoud(fase)) { betreedFase(); return; }
  }
  fase = 'highlights'; faseSinds = 0; // niets te tonen → highlights (toont de lege melding)
}
// Actie bij het betreden van een fase.
function betreedFase() {
  if (fase === 'highlights') {
    bladUit(); hlAan(); hlVolgendeClip();   // speel de volgende clip; einde → scores
  } else if (fase === 'scores') {
    hlUit(); bladUit(); scoresRotatie();
  } else if (fase === 'sheet') {
    hlUit();
    const sheets = sheetLijst();
    const kies = sheets[sheetBeurt % sheets.length];
    sheetBeurt += 1;
    if (kies === 'poster') { bladUit(); toonPoster().then(() => { if (fase === 'sheet' && !podiumActief) naVolgendeFase(); }); }
    else toonSheet(kies);
  }
}

const SCHEMA_TIK_MS = 1000;

// Eén tik van het pauze-schema. Podium heeft altijd voorrang (winnaar-moment).
function schemaTik() {
  if (podiumActief) { hlUit(); bladUit(); fase = 'highlights'; faseSinds = 0; podiumOnderbrak = true; return; }
  if (posterBezig) return;              // poster-animatie loopt; even niet ingrijpen
  if (podiumOnderbrak) { podiumOnderbrak = false; betreedFase(); return; } // herstart na podium

  faseSinds += SCHEMA_TIK_MS;

  if (fase === 'highlights') {
    bladUit();
    if (!hlClips.length) { naVolgendeFase(); return; } // geen clips → door
    if (!hlActief) betreedFase();                      // (her)start + speel de volgende clip
    // verder geen timer: hlClipKlaar() schakelt door bij het einde van de clip
  } else if (fase === 'scores') {
    hlUit(); bladUit();
    if (!liveTafels.length) { naVolgendeFase(); return; }
    scoresRotatie();
    if (faseSinds >= FASE_MS.scores) naVolgendeFase();
  } else if (fase === 'sheet') {
    hlUit();
    if (!sheetLijst().length) { naVolgendeFase(); return; }
    // winnaars/komende lopen op de timer; de poster regelt zichzelf via toonPoster().then.
    if ((!bladWEl.hidden || !bladKEl.hidden) && faseSinds >= FASE_MS.sheet) { bladUit(); naVolgendeFase(); }
  }
}

// Live scores van de (andere) tafels rouleren tijdens de scores-fase, ~elke 6s één kaart.
let scoresTeller = 0;
function scoresRotatie() {
  scoresTeller += SCHEMA_TIK_MS;
  const stage = document.getElementById('stage');
  if (scoresTeller >= CARD_MS || !stage.querySelector('.card')) {
    scoresTeller = 0;
    if (idx >= liveTafels.length) idx = 0;
    const t = liveTafels[idx];
    idx += 1;
    if (liveTafels.length === 1 && huidigeKey === t.table && stage.querySelector('.card')) {
      stage.querySelector('.card').innerHTML = kaartHtml(t); // alleen standen verversen
    } else {
      toon(t);
    }
  }
}

// ============ Ticker (#65) ============
// Vrije berichtenbalk onderin: aankondigingen, sponsors, wat er die avond speelt. Bewust
// géén scores — die staan al in de tafelkaart. De regels komen mee in /api/live (veld
// `ticker`), dus geen extra verzoek; de backend zorgt dat er altijd minstens één regel is.
const TICKER_STANDAARD = ['Waiting for next match...'];
const tickerEl = document.getElementById('ticker');
const tickerSpoor = document.getElementById('tickerSpoor');
let tickerNu = '';        // laatst getoonde inhoud (om niet elke poll opnieuw te bouwen)
let tickerRegels = null;  // laatst ontvangen regels; null → standaardtekst

// Maten bijstellen zonder deploy: ?tickerOnder=2%&tickerBreedte=1100px&tickerHoogte=80px.
// tickerOnder = afstand tot de ONDERRAND. Een kale waarde wordt als pixels gelezen
// (?tickerOnder=20 == 20px). Procenten schalen mee met het venster, pixels niet — in OBS
// is het beeld exact 1920x1080, dus daar komt het op hetzelfde neer.
const zoek = new URLSearchParams(location.search);
const TICKER_SNELHEID = Number(zoek.get('tickerSnelheid')) || 60; // px per seconde
for (const [param, css] of [['tickerOnder', '--ticker-onder'], ['tickerBreedte', '--ticker-breedte'], ['tickerHoogte', '--ticker-hoogte']]) {
  const rauw = String(zoek.get(param) || '').trim();
  if (!rauw) continue;
  const waarde = /^[\d.]+$/.test(rauw) ? `${rauw}px` : rauw;
  document.documentElement.style.setProperty(css, waarde);
}

function zetTicker(regels) {
  const lijst = Array.isArray(regels) && regels.length ? regels : TICKER_STANDAARD;
  const sleutel = lijst.join('');
  if (sleutel === tickerNu) return; // ongewijzigd → de lopende animatie niet onderbreken
  tickerNu = sleutel;

  const reeks = lijst.map((r) => `<span class="item">${esc(r)}</span>`).join('');
  tickerSpoor.innerHTML = reeks;
  tickerEl.hidden = false;

  // Korte reeksen herhalen tot ze breder zijn dan de balk, anders ontstaat er een gat
  // in de lus. Daarna één extra kopie: precies die breedte schuiven we op.
  let veiligheid = 20;
  while (tickerSpoor.scrollWidth > 0 && tickerSpoor.scrollWidth < tickerEl.clientWidth && veiligheid-- > 0) {
    tickerSpoor.insertAdjacentHTML('beforeend', reeks);
  }
  const afstand = tickerSpoor.scrollWidth;
  tickerSpoor.insertAdjacentHTML('beforeend', tickerSpoor.innerHTML);
  tickerSpoor.style.setProperty('--afstand', afstand);
  tickerSpoor.style.animationDuration = `${Math.max(6, afstand / TICKER_SNELHEID)}s`;
}

// ============ Podium-eindscherm (winnaar-moment #54) ============
// Toont na de finale (niemand meer aan tafel) een medaillescherm met de Cuescore-
// spelersfoto's, confetti en laserstralen. Winnaar (1e) krijgt extra: kroon + gouden
// gloed + gouden confetti. Demo-modus met ?demo of ?podium (voor OBS-test / aan Mark
// laten zien) toont een voorbeeldpodium met echte foto's.
const DEMO = /[?&](demo|podium)\b/.test(location.search);
const demoPodium = {
  tournamentName: 'Mokum 8 & 10ball Ranking (10ball) #19',
  podium: [
    { positie: 1, medaille: 'goud',   speler: { name: 'Umut Sarkas', image: 'https://img.cuescore.com/image/d/4/ddf09df16c439b742ce1ec3dda06f0de.png?t=1781888546', flag: 'https://cuescore.com/img/flags/png-country-4x2-none/res-640x480/nl.png' } },
    { positie: 2, medaille: 'zilver', speler: { name: 'Danny Bast',  image: 'https://img.cuescore.com/image/8/4/84d07f5dcd663a4c69840f57aa5828b1.png?t=1731743668', flag: 'https://cuescore.com/img/flags/png-country-4x2-none/res-640x480/nl.png' } },
    { positie: 3, medaille: 'brons',  speler: { name: 'Jun Torres',  image: 'https://img.cuescore.com/image/8/4/862c792ba8eb7f97e626fbe6cbcc59f6.png', flag: 'https://cuescore.com/img/flags/png-country-4x2-none/res-640x480/nl.png' } },
    { positie: 3, medaille: 'brons',  speler: { name: 'Mattias B',   image: 'https://img.cuescore.com/image/f/4/fb0490ea3bdaba5c7989a41d7f710d8f.png?t=1743937005', flag: 'https://cuescore.com/img/flags/png-country-4x2-none/res-640x480/nl.png' } },
  ],
};

const MEDAILLE = {
  goud:   { kleur: '#f4c430', hoogte: 250 },
  zilver: { kleur: '#cbd5e1', hoogte: 190 },
  brons:  { kleur: '#cd7f32', hoogte: 140 },
};

let podiumActief = false;
let vorigePodiumSleutel = null; // om niet elke 15s opnieuw te renderen/confetti te herstarten

function plekHtml(p) {
  const m = MEDAILLE[p.medaille] || MEDAILLE.brons;
  const s = p.speler || {};
  const foto = s.image
    ? `<img class="pfoto" src="${esc(s.image)}" alt="" onerror="this.removeAttribute('src')">`
    : '<span class="pfoto"></span>';
  const vlag = s.flag ? `<img class="pvlag" src="${esc(s.flag)}" alt="">` : '';
  const kroon = p.positie === 1 ? '<div class="kroon">👑</div>' : '';
  return `
    <div class="plek ${esc(p.medaille)}${p.positie === 1 ? ' winner' : ''}" style="--rand:${m.kleur}">
      ${kroon}${foto}
      <div class="pnaam">${esc(s.name || '—')}</div>${vlag}
      <div class="podest" style="height:${m.hoogte}px"><span class="pnum">${esc(p.positie)}</span></div>
    </div>`;
}

function renderPodium(data) {
  const lijst = (data && data.podium) || [];
  const goud = lijst.find((x) => x.positie === 1);
  const zilver = lijst.find((x) => x.positie === 2);
  const brons = lijst.filter((x) => x.positie === 3);
  // Volgorde: zilver links, goud in het midden, brons rechts (klassiek podium).
  const volgorde = [zilver, goud, ...brons].filter(Boolean);
  document.getElementById('podiumRij').innerHTML = volgorde.map(plekHtml).join('');
  document.getElementById('podiumSub').textContent = (data && data.tournamentName) || '';
}

function updatePodium(data) {
  const heeft = !!(data && Array.isArray(data.podium) && data.podium.length);
  const podium = document.getElementById('podium');
  const lasers = document.getElementById('lasers');
  const canvas = document.getElementById('confetti');

  if (!heeft) {
    if (podiumActief) { // net afgelopen → alles opruimen
      podiumActief = false;
      podium.hidden = true; lasers.hidden = true; canvas.hidden = true;
      tickerEl.hidden = false; // ticker weer terug na het medaillescherm (#65)
      stopConfetti();
      document.getElementById('stage').innerHTML = ''; huidigeKey = null;
      vorigePodiumSleutel = null;
    }
    return;
  }

  // Sleutel = namen + posities; alleen bij een echte wijziging opnieuw opbouwen.
  const sleutel = data.podium.map((p) => `${p.positie}:${(p.speler && p.speler.name) || ''}`).join('|');
  if (podiumActief && sleutel === vorigePodiumSleutel) return;
  vorigePodiumSleutel = sleutel;

  podiumActief = true;
  renderPodium(data);
  document.getElementById('stage').innerHTML = ''; huidigeKey = null; // tafelkaarten weg
  podium.hidden = false; lasers.hidden = false; canvas.hidden = false;
  tickerEl.hidden = true; // medaillescherm is een moment op zich — geen ticker eroverheen
  startConfetti();
}

// --- Confetti (canvas) ---
const cvs = document.getElementById('confetti');
const cctx = cvs.getContext('2d');
const CONFETTI_KLEUREN = ['#cc0000', '#f4c430', '#ffffff', '#19c3ff', '#38ff8e', '#ff2fd0'];
let deeltjes = [];
let confettiRaf = null;
let confettiBurstTimer = null;

function voegConfettiToe(aantal, gouden) {
  for (let i = 0; i < aantal; i++) {
    deeltjes.push({
      x: Math.random() * cvs.width,
      y: -20 - Math.random() * 200,
      vx: (Math.random() - 0.5) * 3,
      vy: 3 + Math.random() * 4,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      grootte: 7 + Math.random() * 8,
      kleur: gouden ? (Math.random() < 0.7 ? '#f4c430' : '#ffffff') : CONFETTI_KLEUREN[(Math.random() * CONFETTI_KLEUREN.length) | 0],
    });
  }
}

function confettiFrame() {
  cctx.clearRect(0, 0, cvs.width, cvs.height);
  for (const p of deeltjes) {
    p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.04; // lichte zwaartekracht
    cctx.save();
    cctx.translate(p.x, p.y); cctx.rotate(p.rot);
    cctx.fillStyle = p.kleur;
    cctx.fillRect(-p.grootte / 2, -p.grootte / 2, p.grootte, p.grootte * 0.6);
    cctx.restore();
  }
  deeltjes = deeltjes.filter((p) => p.y < cvs.height + 30);
  confettiRaf = podiumActief ? requestAnimationFrame(confettiFrame) : null;
}

function startConfetti() {
  voegConfettiToe(160, false);      // openingsknal
  voegConfettiToe(80, true);        // extra goud voor de winnaar
  if (!confettiRaf) confettiFrame();
  // Elke paar seconden een nieuwe (kleinere) golf zodat het een minuut feestelijk blijft.
  clearInterval(confettiBurstTimer);
  confettiBurstTimer = setInterval(() => {
    if (!podiumActief) return;
    voegConfettiToe(50, false);
    voegConfettiToe(24, true);
  }, 2600);
}

function stopConfetti() {
  clearInterval(confettiBurstTimer); confettiBurstTimer = null;
  deeltjes = [];
  if (confettiRaf) { cancelAnimationFrame(confettiRaf); confettiRaf = null; }
  cctx.clearRect(0, 0, cvs.width, cvs.height);
}

// Opstarten: ticker meteen met de standaardtekst, data + highlights ophalen, dan het
// pauze-schema starten. De YouTube-IFrame-API laadt async en roept hlStartSpeler aan.
zetTicker(null);
ververs();
setInterval(ververs, REFRESH_MS);
haalHighlights();
setInterval(haalHighlights, HIGHLIGHTS_VERVERS_MS);
haalSheets();
setInterval(haalSheets, SHEETS_VERVERS_MS);

window.onYouTubeIframeAPIReady = hlStartSpeler;
const ytApi = document.createElement('script');
ytApi.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(ytApi);

// In demo-modus meteen tonen (niet op de eerste fetch wachten).
if (DEMO) updatePodium(demoPodium);

// --- Promo-poster met theatergordijn-overgang (#54) ---
// Test-stand: met ?test (of ?snel) in de URL komt de poster al na een paar seconden,
// zodat je de overgang in OBS kunt testen zonder 2 minuten te wachten. De gewone URL
// blijft 120s / 20s (productie).
const TEST = /[?&](test|snel)\b/.test(location.search);
// De poster hoort nu in het pauze-schema: hij komt aan de beurt na de scores-fase en blijft
// FASE_MS.poster in beeld (standaard 5s, in te stellen met ?posterSec=).
const POSTER_DUUR_MS = FASE_MS.poster;
const GORDIJN_MS = 1000;           // duur van dicht-/openschuiven (== CSS-transition)
let posterBezig = false;
const wacht = (ms) => new Promise((r) => setTimeout(r, ms));

async function toonPoster() {
  posterBezig = true;
  const curtain = document.getElementById('curtain');
  const poster = document.getElementById('poster');
  curtain.classList.add('dicht');        // gordijn dicht
  await wacht(GORDIJN_MS);
  poster.hidden = false;                  // poster erachter klaarzetten
  tickerEl.hidden = true;                 // de poster is fullbleed → ticker eronderuit (#65)
  curtain.classList.remove('dicht');      // gordijn open → poster in beeld
  await wacht(GORDIJN_MS + POSTER_DUUR_MS);
  curtain.classList.add('dicht');         // weer dicht
  await wacht(GORDIJN_MS);
  poster.hidden = true;                   // terug naar de jumbotron
  if (!podiumActief) tickerEl.hidden = false;
  curtain.classList.remove('dicht');      // gordijn open
  await wacht(GORDIJN_MS);
  posterBezig = false;
}

// Alleen tonen als de poster-afbeelding echt bestaat (anders geen zwart vlak op de stream).
const posterImg = document.querySelector('#poster img');
let posterBeschikbaar = false;
posterImg.addEventListener('load', () => { posterBeschikbaar = true; });
posterImg.addEventListener('error', () => { posterBeschikbaar = false; });

// Pauze-schema starten: highlights → scores → poster → herhaal (zie schemaTik). Helemaal
// onderaan, zodat alle functies en poster-variabelen die 'ie aanroept al bestaan.
setInterval(schemaTik, SCHEMA_TIK_MS);
// In de test-stand meteen na een paar seconden een eerste keer, zodat je 'm snel ziet.
if (TEST) setTimeout(() => { if (posterBeschikbaar && !podiumActief) toonPoster(); }, 6000);
</script>
