<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Competitie — stand en uitslagen</title>
<meta name="robots" content="noindex">
<style>
  /* Competitiescherm (#147): stand + uitslagen van de afgelopen maand, in de laatste
     minuten van een competitiestream. Zelfde huisstijl als de jumbotron-slide: zaalfoto,
     donkere kaart, zwart/rood, Arial Black. Vast 1920×1080 zoals alle OBS-bronnen.

     In OBS: browserbron "Competitiestand" per tafelscène, URL /competitie/?tafel=N.
     checkStops zet die bron aan zodra de teamwedstrijd klaar is (api-contract v0.62).

     Stand en uitslagen komen RECHTSTREEKS uit de Cuescore-API (die staat browsers dat toe);
     alleen "welke wedstrijd staat op deze tafel" komt uit onze eigen /api/live. Geen
     extra Azure-kosten en geen YouTube-quota.

     Parameters:
       ?tafel=15               normaal gebruik: competitie + wedstrijd uit /api/live
       ?niveau=Eerste Klasse   of   ?toernooi=83574424   handmatig een competitie kiezen
       ?match=88251085         (handmatig) wedstrijd van vanavond: beide teams uitgelicht
       ?maand=2026-09          een kalendermaand i.p.v. de afgelopen 31 dagen
       ?scherm=stand|uitslagen één vast scherm (geen wissel)
       ?scherm=bedankt         alleen het bedankscherm
       ?demo                   hele volgorde afspelen alsof de wedstrijd net klaar is
       ?seconden=20            (bij ?demo) stand en uitslagen elk N s, bedankt N/2 s */
  html, body {
    margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden;
    background: #000; color: #fff; font-family: 'Arial Black', Arial, sans-serif;
  }
  .bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(180deg, rgba(0,0,0,0.70) 0%, rgba(0,0,0,0.55) 40%, rgba(0,0,0,0.80) 100%),
      url('../pauze/img/jumbotron-bg.jpg'),
      linear-gradient(160deg, #12161d, #0a0d11);
    background-size: 100% 100%, 100% 100%, cover;
  }
  .card {
    position: absolute; left: 50%; top: 36px; width: 1500px; margin-left: -750px;
    height: 1008px; box-sizing: border-box; padding: 34px 56px 26px;
    background: rgba(8,8,8,0.84); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    display: flex; flex-direction: column;
    opacity: 0; transition: opacity 0.6s ease;
  }
  .card.zichtbaar { opacity: 1; }

  /* Kop: niveau in rood (zoals de competitie-thumbnail), daaronder wat je ziet. */
  .kop { display: flex; align-items: flex-end; justify-content: space-between;
         border-bottom: 4px solid #cc0000; padding-bottom: 18px; margin-bottom: 14px; }
  .kop .niveau { font-size: 26px; color: #ff3b3b; letter-spacing: 3px; text-transform: uppercase; }
  .kop h1 { margin: 6px 0 0; font-size: 60px; line-height: 1; letter-spacing: 1px; text-transform: uppercase; }
  .kop .rechts { text-align: right; font-family: Arial, sans-serif; font-weight: bold;
                 color: rgba(255,255,255,0.6); font-size: 22px; line-height: 1.4; }

  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 0 10px; white-space: nowrap; }
  th { font-family: Arial, sans-serif; font-size: 19px; color: rgba(255,255,255,0.5);
       font-weight: bold; text-align: center; height: 44px; letter-spacing: 1px; }
  th.links { text-align: left; }
  .logo { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; vertical-align: middle;
          background: rgba(255,255,255,0.08); }
  .leeg-logo { display: inline-block; width: 42px; height: 42px; border-radius: 8px;
               background: rgba(255,255,255,0.08); vertical-align: middle; }

  /* Stand */
  .stand tr.rij td { height: var(--rij, 58px); font-size: var(--letter, 30px); text-align: center;
                     border-top: 1px solid rgba(255,255,255,0.07); }
  .stand td.pos { width: 60px; color: rgba(255,255,255,0.55); }
  .stand tr.rij td.team { text-align: left; }
  .stand td.team span { margin-left: 16px; vertical-align: middle; }
  .stand td.pnt { font-size: 34px; color: #fff; width: 110px; }
  .stand td.klein { font-family: Arial, sans-serif; font-weight: bold; font-size: 28px;
                    color: rgba(255,255,255,0.75); width: 88px; }
  .stand tr.mokum td.team span { color: #fff; }
  .stand tr:not(.mokum) td.team span { color: rgba(255,255,255,0.78); }

  /* Uitlichten: de teams van vanavond — rode balk links + lichte rode gloed. */
  tr.vanavond td { background: rgba(204,0,0,0.22); }
  tr.vanavond td:first-child { box-shadow: inset 6px 0 0 #cc0000; }

  /* Uitslagen */
  .ronde { font-size: 22px; color: #ff3b3b; letter-spacing: 2px; text-transform: uppercase;
           padding: 12px 0 4px; }
  .uitslagen td { height: var(--rij, 49px); font-size: var(--letter, 27px); border-top: 1px solid rgba(255,255,255,0.07); }
  .uitslagen td.datum { font-family: Arial, sans-serif; font-weight: bold; font-size: 21px;
                        color: rgba(255,255,255,0.55); width: 130px; }
  .uitslagen td.thuis { text-align: right; width: 520px; }
  .uitslagen td.uit { text-align: left; width: 520px; }
  .uitslagen td.thuis .logo, .uitslagen td.thuis .leeg-logo { margin-left: 14px; }
  .uitslagen td.uit .logo, .uitslagen td.uit .leeg-logo { margin-right: 14px; }
  .uitslagen td.score { text-align: center; width: 150px; font-size: 32px; }
  .score .pil { display: inline-block; min-width: 110px; padding: 4px 0; border-radius: 10px;
                background: rgba(255,255,255,0.10); }
  .score .pil.nog { background: transparent; color: rgba(255,255,255,0.4);
                    font-family: Arial, sans-serif; font-weight: bold; font-size: 22px; }
  .score .pil.live { background: #cc0000; }
  .winnaar { color: #fff; }
  .verliezer { color: rgba(255,255,255,0.55); }

  .voet { margin-top: auto; display: flex; justify-content: space-between; align-items: center;
          font-family: Arial, sans-serif; font-weight: bold; font-size: 20px;
          color: rgba(255,255,255,0.45); padding-top: 14px; }
  .stippen span { display: inline-block; width: 12px; height: 12px; border-radius: 50%;
                  background: rgba(255,255,255,0.25); margin-left: 10px; }
  .stippen span.aan { background: #cc0000; }
  .melding { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             font-size: 36px; color: rgba(255,255,255,0.7); }
  .melding[hidden] { display: none; }

  /* Bedankscherm (wens Peter 18-09): de laatste seconden vóór de stop. */
  /* Geen voettekst en geen uitleg per partner (Peter 18-09): alles verticaal gecentreerd. */
  .bedankt { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
             text-align: center; }
  .bedankt .niveau { font-size: 28px; color: #ff3b3b; letter-spacing: 3px; text-transform: uppercase; }
  .bedankt h1 { font-size: 110px; line-height: 1; margin: 14px 0 0; letter-spacing: 2px; text-transform: uppercase; }
  /* Eindstand (Peter 18-09): score groot in het midden, links en rechts een even groot kader
     met logo + teamnaam, gespiegeld (logo's aan de kant van de score) zodat het geheel
     symmetrisch is. Een lange naam mag over twee regels; past dat nog niet, dan krimpt de
     letter (pasTeamnamenAan). */
  .bedankt .uitslag { width: 100%; margin-top: 44px; display: grid; grid-template-columns: 1fr auto 1fr;
                      align-items: center; gap: 36px; }
  .bedankt .uitslag .team { height: 150px; box-sizing: border-box; padding: 0 28px;
                            display: flex; align-items: center; gap: 24px; min-width: 0;
                            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10);
                            border-radius: 16px; }
  .bedankt .uitslag .team.thuis { flex-direction: row-reverse; text-align: right; }
  .bedankt .uitslag .team.uit { text-align: left; }
  .bedankt .uitslag .teamnaam { flex: 1; min-width: 0; font-size: 42px; line-height: 1.15; }
  .bedankt .uitslag .logo, .bedankt .uitslag .leeg-logo { width: 84px; height: 84px; flex: none; }
  .bedankt .uitslag .pil { background: #cc0000; border-radius: 20px; padding: 8px 40px;
                           font-size: 104px; line-height: 1.1; white-space: nowrap; }
  .bedankt .dank { margin-top: 70px; font-size: 22px; color: rgba(255,255,255,0.55); letter-spacing: 3px; text-transform: uppercase; }
  .bedankt .partners { display: flex; gap: 40px; margin-top: 28px; }
  .bedankt .partner { width: 400px; min-height: 230px; padding: 32px 24px; box-sizing: border-box;
                      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); border-radius: 16px;
                      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .bedankt .partner .beeld { height: 110px; display: flex; align-items: center; justify-content: center; }
  .bedankt .partner img { max-height: 110px; max-width: 300px; }
  .bedankt .partner .cs img { width: 270px; }
  .bedankt .partner .hart { width: 110px; height: 110px; border-radius: 50%; background: #cc0000;
                            display: flex; align-items: center; justify-content: center; }
  .bedankt .partner .hart svg { width: 58px; height: 58px; margin-top: 4px; }
  .bedankt .partner .naam { font-size: 30px; line-height: 1.2; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="card" id="kaart"></div>
<div class="melding" id="melding">Competitie laden…</div>

<script>
// Cuescore-toernooi per niveau, seizoen 2026/2027. Kopie van
// backend/src/mokumCompetitie/toernooien.js — ELK SEIZOEN BIJWERKEN (daar én hier).
const TOERNOOI_PER_NIVEAU = {
  'Eerste Klasse': 83574424,
  'Tweede Klasse': 83574427,
  'Derde Klasse': 83574403,
  'Eredivisie': 83574874,
  'Eerste Divisie': 83574886,
  'Derde Divisie Noord-West': 83574898,
};
const MOKUM_VENUE_ID = 60451687;
const TZ = 'Europe/Amsterdam';
const MAANDEN = ['januari','februari','maart','april','mei','juni','juli','augustus',
                 'september','oktober','november','december'];

// Zelfde keuze als de jumbotron: lokaal testen tegen de lokale Functions-host, anders productie.
const APP_API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
  ? 'http://localhost:7071'
  : 'https://mokum-streams-func.azurewebsites.net';

const q = new URLSearchParams(location.search);
const tafel = Number(q.get('tafel')) || null;
const vastScherm = q.get('scherm');                 // 'stand' | 'uitslagen' | 'bedankt' | null
// Welke competitie en wedstrijd: bij ?tafel= uit /api/live (zie laadTafel), anders uit de URL.
let niveau = q.get('niveau');
let toernooiId = Number(q.get('toernooi')) || TOERNOOI_PER_NIVEAU[niveau] || null;
let matchId = Number(q.get('match')) || null;
// Wanneer checkStops de stream stopt (uit /api/live, klaarSinds + 5 min). De pagina telt
// daarnaar af (besluit Peter 18-09): stand 2 min → uitslagen 2 min → bedankscherm 1 min.
// Het scherm gaat aan bij klaarSinds, dus die drie vullen samen precies de wachttijd.
let stopOm = null;
const demo = q.has('demo');
const demoSec = Number(q.get('seconden')) || 0;
const STAND_MS = (demo && demoSec ? demoSec : 120) * 1000;
const UITSLAGEN_MS = (demo && demoSec ? demoSec : 120) * 1000;   // verdeeld over de uitslag-pagina's
const BEDANKT_MS = (demo && demoSec ? demoSec / 2 : 60) * 1000;

// Welke uitslagen: standaard de afgelopen 31 dagen (besluit Peter 18-09 — een kalendermaand
// is aan het begin van de maand bijna leeg). Met ?maand=2026-09 één kalendermaand.
const MAAND = (() => {
  const m = /^(\d{4})-(\d{1,2})$/.exec(q.get('maand') || '');
  return m ? { jaar: Number(m[1]), maand: Number(m[2]) } : null;
})();
const VENSTER_MS = 31 * 24 * 3600 * 1000;

function maandVan(iso) {
  const d = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit' })
    .formatToParts(new Date(iso));
  return { jaar: Number(d.find(p => p.type === 'year').value), maand: Number(d.find(p => p.type === 'month').value) };
}
// Hoort deze wedstrijd bij de uitslagen?
function inUitslagen(m, nuMs) {
  if (!m.starttime) return false;
  if (MAAND) { const x = maandVan(m.starttime); return x.jaar === MAAND.jaar && x.maand === MAAND.maand; }
  // Afgelopen 31 dagen: alleen wat gespeeld is of nu loopt (de wedstrijd van vanavond
  // staat er dus altijd bij), geen wedstrijden die nog moeten komen.
  const t = Date.parse(m.starttime);
  return (m.matchstatus === 'finished' || m.matchstatus === 'playing' || m.matchId === matchId)
    && t <= nuMs && t >= nuMs - VENSTER_MS;
}
function uitslagenTitel() {
  return MAAND ? `Uitslagen ${MAANDEN[MAAND.maand - 1]}` : 'Uitslagen afgelopen maand';
}
function korteDatum(iso) {
  return new Intl.DateTimeFormat('nl-NL', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short' })
    .format(new Date(iso)).replace('.', '');
}
// Tekst veilig in HTML zetten (teamnamen komen van buiten).
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]); }
function logo(team) {
  return team && team.image ? `<img class="logo" src="${esc(team.image)}" alt="">` : '<span class="leeg-logo"></span>';
}
function isMokum(team) { return team && team.venueId === MOKUM_VENUE_ID; }

// ---- Opbouw van de twee schermen ------------------------------------------------------

function kop(niveau, titel, rechts) {
  return `<div class="kop"><div><div class="niveau">${esc(niveau)}</div><h1>${esc(titel)}</h1></div>
          <div class="rechts">${rechts}</div></div>`;
}

function schermStand(t, niveau, teamsVanavond) {
  // standings is een object per groep ({"1": [...]}); een competitie heeft er één.
  const rijen = Object.values(t.standings || {})[0] || [];
  const gespeeld = Math.max(0, ...rijen.map(r => r.played || 0));
  const html = rijen.map(r => {
    const team = r.player || {};
    const klassen = ['rij', isMokum(team) ? 'mokum' : '', teamsVanavond.has(team.teamId) ? 'vanavond' : ''].join(' ');
    const saldo = (r.frameWins || 0) - (r.frameLosses || 0);
    return `<tr class="${klassen}">
      <td class="pos">${esc(r.position)}</td>
      <td class="team">${logo(team)}<span>${esc(team.name)}</span></td>
      <td class="klein">${r.played || 0}</td>
      <td class="klein">${r.wins || 0}</td>
      <td class="klein">${r.ties || 0}</td>
      <td class="klein">${r.losses || 0}</td>
      <td class="klein">${r.frameWins || 0}–${r.frameLosses || 0}</td>
      <td class="klein">${saldo > 0 ? '+' : ''}${saldo}</td>
      <td class="pnt">${r.points || 0}</td>
    </tr>`;
  }).join('');
  const rij = Math.min(58, Math.floor(700 / Math.max(1, rijen.length)));
  const stijl = `--rij:${rij}px;--letter:${Math.min(30, Math.round(rij * 0.52))}px`;
  return kop(niveau, 'Stand', `Seizoen 2026/2027<br>na ${gespeeld} ${gespeeld === 1 ? 'wedstrijd' : 'wedstrijden'}`) +
    `<table class="stand" style="${stijl}"><thead><tr>
       <th></th><th class="links">TEAM</th><th>GS</th><th>W</th><th>G</th><th>V</th>
       <th>PARTIJEN</th><th>+/−</th><th>PNT</th>
     </tr></thead><tbody>${html}</tbody></table>`;
}

// Eén uitslagregel.
function uitslagRij(m) {
  const a = m.playerA || {}, b = m.playerB || {};
  const klaar = m.matchstatus === 'finished';
  const bezig = m.matchstatus === 'playing';
  let score, kA = '', kB = '';
  if (klaar || bezig) {
    score = `<span class="pil ${bezig ? 'live' : ''}">${m.scoreA} – ${m.scoreB}</span>`;
    if (klaar && m.scoreA !== m.scoreB) {
      kA = m.scoreA > m.scoreB ? 'winnaar' : 'verliezer';
      kB = m.scoreB > m.scoreA ? 'winnaar' : 'verliezer';
    }
  } else {
    score = '<span class="pil nog">nog te spelen</span>';
  }
  return `<tr class="${m.matchId === matchId ? 'vanavond' : ''}">
    <td class="datum">${esc(korteDatum(m.starttime))}</td>
    <td class="thuis ${kA}">${esc(a.name)}${logo(a)}</td>
    <td class="score">${score}</td>
    <td class="uit ${kB}">${logo(b)}${esc(b.name)}</td>
  </tr>`;
}

// Uitslagen als één of meer schermen. In 31 dagen kunnen 3-4 rondes vallen (in de Derde
// Klasse 8 wedstrijden per ronde), dat past niet op één scherm. Daarom per ronde verdelen:
// een ronde wordt nooit over twee schermen geknipt.
const MAX_REGELS = 16;   // wedstrijden + ronde-koppen per scherm
function schermenUitslagen(t, niveauNaam) {
  const nuMs = Date.now();
  const wedstrijden = (t.matches || [])
    .filter(m => inUitslagen(m, nuMs))
    .sort((a, b) => (a.round - b.round) || (new Date(a.starttime) - new Date(b.starttime)));
  const gespeeld = wedstrijden.filter(m => m.matchstatus === 'finished').length;

  const rondes = [];
  for (const m of wedstrijden) {
    const laatste = rondes[rondes.length - 1];
    if (laatste && laatste.naam === m.roundName) laatste.lijst.push(m);
    else rondes.push({ naam: m.roundName, lijst: [m] });
  }
  const paginas = [];
  for (const r of rondes) {
    const huidige = paginas[paginas.length - 1];
    const regels = r.lijst.length + 1;
    if (huidige && huidige.regels + regels <= MAX_REGELS) { huidige.rondes.push(r); huidige.regels += regels; }
    else paginas.push({ rondes: [r], regels });
  }
  if (paginas.length === 0) paginas.push({ rondes: [], regels: 1 });

  const rechts = MAAND ? `Seizoen 2026/2027<br>${gespeeld} van ${wedstrijden.length} gespeeld`
                       : `Seizoen 2026/2027<br>${gespeeld} ${gespeeld === 1 ? 'wedstrijd' : 'wedstrijden'} gespeeld`;
  return paginas.map((p, i) => () => {
    const rij = Math.min(49, Math.floor(680 / Math.max(1, p.regels)));
    const stijl = `--rij:${rij}px;--letter:${Math.min(27, Math.round(rij * 0.56))}px`;
    let html = p.rondes.map(r =>
      `<tr><td colspan="4" class="ronde">${esc(r.naam)}</td></tr>` + r.lijst.map(uitslagRij).join('')).join('');
    if (!html) html = '<tr><td class="ronde">Nog geen uitslagen</td></tr>';
    const deel = paginas.length > 1 ? ` (${i + 1}/${paginas.length})` : '';
    return kop(niveauNaam, uitslagenTitel() + deel, rechts) +
      `<table class="uitslagen" style="${stijl}"><tbody>${html}</tbody></table>`;
  });
}

// Bedankscherm (wens Peter 18-09): vlak voor de stop een bedankje aan wie deze uitzending
// mogelijk maakt — de KNBB (organiseert de competitie), CueScore (houdt uitslagen en standen
// bij) en alle vrijwilligers en teamcaptains. Met de eindstand van vanavond erbij.
const HART_SVG = '<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
function schermBedankt(niveauNaam, vanavond) {
  const a = vanavond && vanavond.playerA, b = vanavond && vanavond.playerB;
  const uitslag = vanavond
    ? `<div class="uitslag">
        <div class="team thuis">${logo(a)}<div class="teamnaam">${esc(a.name)}</div></div>
        <span class="pil">${vanavond.scoreA} – ${vanavond.scoreB}</span>
        <div class="team uit">${logo(b)}<div class="teamnaam">${esc(b.name)}</div></div>
      </div>`
    : '';
  return `<div class="bedankt">
    <div class="niveau">${esc(niveauNaam)}</div>
    <h1>Thanks for watching!</h1>
    ${uitslag}
    <div class="dank">Deze uitzending is mogelijk dankzij</div>
    <div class="partners">
      <div class="partner"><div class="beeld"><img src="knbb-logo.png" alt=""></div><div class="naam">KNBB</div></div>
      <div class="partner"><div class="beeld cs"><img src="https://cuescore.com/img/cuescore-logo-white.svg" alt=""></div><div class="naam">CueScore</div></div>
      <div class="partner"><div class="beeld"><div class="hart">${HART_SVG}</div></div><div class="naam">Alle vrijwilligers<br>en teamcaptains</div></div>
    </div>
  </div>`;
}

// ---- Laden en wisselen ----------------------------------------------------------------

const kaart = document.getElementById('kaart');
const melding = document.getElementById('melding');
let stand = [];              // [scherm-functie]
let uitslagen = [];          // [scherm-functie, ...] één per pagina
let bedankt = null;          // scherm-functie
let geenCompetitie = false;  // ?tafel= zonder competitiestream
let huidigeSleutel = null;   // wat er nu in beeld staat ('stand', 'u0', 'u1', 'bedankt')
const paginaStart = Date.now();

// ?tafel=N: welke competitiewedstrijd loopt er op deze tafel? Uit /api/live (v0.62).
// Geeft false als er op die tafel geen competitiestream loopt.
async function laadTafel() {
  const r = await fetch(`${APP_API}/api/live`, { cache: 'no-store' });
  if (!r.ok) throw new Error(`/api/live gaf ${r.status}`);
  const live = await r.json();
  const t = (live.tables || []).find(x => Number(x.tableNumber) === tafel);
  const c = t && t.competitie;
  if (!c || !c.toernooiId) return false;
  niveau = c.niveau;
  toernooiId = c.toernooiId;
  matchId = c.matchId || null;
  stopOm = c.stopOm || null;
  return true;
}

async function laad() {
  geenCompetitie = !!tafel && !(await laadTafel());
  if (geenCompetitie) return;
  const r = await fetch(`https://api.cuescore.com/tournament/?lang=nl&id=${toernooiId}`, { cache: 'no-store' });
  if (!r.ok) throw new Error(`Cuescore gaf ${r.status}`);
  const t = await r.json();
  const niveauNaam = niveau || Object.keys(TOERNOOI_PER_NIVEAU).find(n => TOERNOOI_PER_NIVEAU[n] === toernooiId) || t.name;
  const vanavond = (t.matches || []).find(m => m.matchId === matchId);
  const teamsVanavond = new Set(vanavond ? [vanavond.playerA?.teamId, vanavond.playerB?.teamId] : []);
  stand = [() => schermStand(t, niveauNaam, teamsVanavond)];
  uitslagen = schermenUitslagen(t, niveauNaam);
  bedankt = () => schermBedankt(niveauNaam, vanavond);
}

// Welk scherm hoort er nu in beeld? Retour een sleutel: 'stand', 'u<pagina>' of 'bedankt'.
function welkScherm(nuMs) {
  if (vastScherm === 'bedankt') return 'bedankt';
  if (vastScherm === 'stand') return 'stand';
  const uPagina = (verstreken) =>
    'u' + Math.min(uitslagen.length - 1, Math.floor(verstreken / (UITSLAGEN_MS / uitslagen.length)));
  if (vastScherm === 'uitslagen') return uPagina((nuMs - paginaStart) % UITSLAGEN_MS);

  // Terugtellen naar de stop. ?demo speelt de volgorde in een lus af vanaf het laden.
  let stop = stopOm ? Date.parse(stopOm) : null;
  if (demo) {
    const cyclus = STAND_MS + UITSLAGEN_MS + BEDANKT_MS;
    stop = paginaStart + cyclus * (Math.floor((nuMs - paginaStart) / cyclus) + 1);
  }
  if (stop) {
    const rest = stop - nuMs;
    if (rest <= BEDANKT_MS) return 'bedankt';
    if (rest <= BEDANKT_MS + UITSLAGEN_MS) return uPagina(BEDANKT_MS + UITSLAGEN_MS - rest);
    return 'stand';
  }
  // Geen stoptijd (met de hand aangezet vóór de wedstrijd klaar is): stand en uitslagen om
  // en om, elk 2 minuten, zonder bedankscherm.
  const inCyclus = (nuMs - paginaStart) % (STAND_MS + UITSLAGEN_MS);
  return inCyclus < STAND_MS ? 'stand' : uPagina(inCyclus - STAND_MS);
}

function toon(sleutel, vervagen = true) {
  huidigeSleutel = sleutel;
  if (geenCompetitie) {
    // Alleen te zien als iemand de bron met de hand aanzet op een tafel zonder competitie.
    kaart.classList.remove('zichtbaar');
    melding.textContent = `Geen competitiewedstrijd op tafel ${tafel}`;
    melding.hidden = false;
    return;
  }
  melding.hidden = true;
  const volgorde = vastScherm ? [] : ['stand', ...uitslagen.map((_, i) => 'u' + i)];
  const stippen = volgorde.length > 1 && sleutel !== 'bedankt'
    ? `<div class="stippen">${volgorde.map(k => `<span class="${k === sleutel ? 'aan' : ''}"></span>`).join('')}</div>`
    : '<div></div>';
  const scherm = sleutel === 'bedankt' ? bedankt : sleutel === 'stand' ? stand[0] : uitslagen[Number(sleutel.slice(1))];
  kaart.classList.remove('zichtbaar');
  setTimeout(() => {
    // Het bedankscherm heeft geen voettekst (Peter 18-09); de andere schermen wel.
    const voet = sleutel === 'bedankt' ? ''
      : `<div class="voet"><div>MOKUM POOL &amp; DARTS · bron: cuescore.com</div>${stippen}</div>`;
    kaart.innerHTML = scherm() + voet;
    pasTeamnamenAan();
    kaart.classList.add('zichtbaar');
  }, vervagen ? 600 : 0);
}

// Teamnamen op het bedankscherm mogen over twee regels. Past een naam ook dan niet in zijn
// kader, dan de letter stapje voor stapje kleiner — voor BEIDE namen tegelijk, zodat de
// twee kaders symmetrisch blijven.
function pasTeamnamenAan() {
  const namen = [...kaart.querySelectorAll('.bedankt .uitslag .teamnaam')];
  // Niet passen = meer dan twee regels, of één woord dat breder is dan het kader. (Niet op
  // scrollHeight meten: Arial Black steekt boven de regelhoogte uit, dan "past" nooit iets.)
  const pastNiet = (el) => el.offsetHeight > px * 1.15 * 2 + 4 || el.scrollWidth > el.clientWidth + 4;
  let px = 42;
  const zet = () => namen.forEach((el) => { el.style.fontSize = px + 'px'; });
  zet();
  while (namen.some(pastNiet) && px > 22) { px -= 2; zet(); }
}

async function start() {
  if (!tafel && !toernooiId) { melding.textContent = 'Geef ?tafel=, ?niveau= of ?toernooi= mee'; return; }
  try {
    await laad();
  } catch (e) {
    melding.textContent = 'Kan de competitie niet laden (' + e.message + ')';
    return;
  }
  toon(welkScherm(Date.now()), false);
  // Elke seconde kijken of er een ander scherm aan de beurt is.
  setInterval(() => {
    if (geenCompetitie) return;
    const sleutel = welkScherm(Date.now());
    if (sleutel !== huidigeSleutel) toon(sleutel);
  }, 1000);
  // Data elke 2 minuten verversen (een lopende stand kan tijdens de laatste minuten nog
  // veranderen). Het bedankscherm laten we staan. Mislukt verversen: oude data houden.
  setInterval(async () => {
    try {
      await laad();
      if (huidigeSleutel !== 'bedankt') toon(welkScherm(Date.now()), false);
    } catch (e) { /* oude data houden */ }
  }, 120000);
}
start();
</script>
